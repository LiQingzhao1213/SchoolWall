<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>校园表白墙 💕</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ==================== 1. 全局基础样式 ==================== */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      background-color: #fce4ec; 
      /* 弥散柔光渐变背景 */
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 182, 193, 0.7) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(221, 160, 221, 0.6) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(255, 192, 203, 0.8) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(230, 230, 250, 0.7) 0px, transparent 50%);
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      padding: 16px; 
      padding-bottom: 90px; 
      color: #2c3e50; 
      min-height: 100vh;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 71, 126, 0.3); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ==================== 2. 顶栏：液态玻璃样式 ==================== */
    header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 12px 18px; 
      position: sticky; 
      top: 12px; 
      z-index: 100; 
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(255, 105, 180, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.9);
    }

    .user-profile { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      background: rgba(255, 255, 255, 0.7); 
      padding: 6px 14px 6px 6px; 
      border-radius: 20px; 
      cursor: pointer; 
      border: 1px solid rgba(255, 255, 255, 0.9);
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .user-profile:active { transform: scale(0.96); }

    .user-avatar { 
      width: 32px; 
      height: 32px; 
      background: linear-gradient(135deg, #ff758c, #ff477e); 
      color: #fff; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 14px; 
      font-weight: bold; 
      box-shadow: 0 3px 8px rgba(255, 71, 126, 0.3);
    }
    .user-name-text { 
      font-size: 13px; 
      font-weight: 600; 
      color: #4a4a4a; 
      max-width: 90px; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      white-space: nowrap; 
    }

    .header-title { 
      font-size: 18px; 
      background: linear-gradient(135deg, #ff477e, #e056fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800; 
      letter-spacing: 0.5px; 
    }

    .chat-nav-btn { 
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,240,245,0.9)); 
      border: 1px solid rgba(255, 71, 126, 0.3); 
      color: #ff477e; 
      padding: 8px 16px; 
      border-radius: 20px; 
      font-size: 12px; 
      font-weight: 700; 
      cursor: pointer; 
      box-shadow: 0 4px 12px rgba(255, 71, 126, 0.15);
      transition: all 0.25s ease;
    }
    .chat-nav-btn:active { transform: scale(0.95); }

    /* ==================== 3. 悬浮发帖玻璃按钮 (FAB) ==================== */
    .fab-btn { 
      position: fixed; 
      bottom: 28px; 
      right: 22px; 
      background: linear-gradient(135deg, #ff758c, #ff477e); 
      color: #fff; 
      width: 60px; 
      height: 60px; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 28px; 
      box-shadow: 0 10px 25px rgba(255, 71, 126, 0.45); 
      border: 2px solid rgba(255, 255, 255, 0.6); 
      cursor: pointer; 
      z-index: 99; 
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .fab-btn:active { transform: scale(0.9) rotate(90deg); }

    .wall-title { 
      font-size: 15px; 
      margin: 20px 0 14px 6px; 
      color: #7d6e83; 
      font-weight: 700; 
      letter-spacing: 0.5px;
    }

    /* ==================== 4. 表白卡片 (液态拟态玻璃) ==================== */
    .post-card { 
      background: rgba(255, 255, 255, 0.6); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 20px; 
      border-radius: 20px; 
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.8); 
      margin-bottom: 18px; 
      transition: all 0.3s ease;
    }

    .post-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      margin-bottom: 12px; 
    }
    .post-author { 
      color: #8e8e93; 
      font-size: 12px; 
      cursor: pointer; 
      font-weight: 600; 
      background: rgba(255, 255, 255, 0.5);
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .post-author:hover { background: rgba(255, 255, 255, 0.9); }
    .post-target { 
      font-weight: 800; 
      color: #ff477e; 
      font-size: 15px; 
      background: rgba(255, 240, 245, 0.8);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 71, 126, 0.15);
    }

    .post-content { 
      font-size: 15px; 
      line-height: 1.6; 
      margin-bottom: 16px; 
      word-break: break-all; 
      color: #333; 
      font-weight: 400;
    }

    .post-footer { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px dashed rgba(0, 0, 0, 0.08); 
      padding-bottom: 12px; 
    }
    .action-btn { 
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,240,245,0.8)); 
      border: 1px solid rgba(255, 71, 126, 0.25); 
      color: #ff477e; 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 12px; 
      font-weight: 700;
      cursor: pointer; 
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(255, 71, 126, 0.1);
    }
    .action-btn:active { transform: scale(0.92); }

    /* ==================== 5. 评论区样式 ==================== */
    .comments-section { 
      margin-top: 14px; 
      background: rgba(255, 255, 255, 0.45); 
      padding: 12px 14px; 
      border-radius: 14px; 
      border: 1px solid rgba(255, 255, 255, 0.6); 
    }
    .comment-item { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 12px; 
      color: #4a4a4a; 
      padding: 6px 0; 
      border-bottom: 1px solid rgba(0,0,0,0.03); 
      word-break: break-all; 
    }
    .comment-item:last-child { border-bottom: none; }
    .comment-author { font-weight: 700; color: #e056fd; cursor: pointer; }
    .reply-btn { 
      color: #ff477e; 
      font-size: 11px; 
      cursor: pointer; 
      border: none; 
      background: rgba(255, 255, 255, 0.8); 
      padding: 3px 8px;
      border-radius: 6px;
      flex-shrink: 0; 
      margin-left: 8px; 
      font-weight: 700; 
    }

    .comment-input-group { display: flex; gap: 8px; margin-top: 10px; }
    .comment-input { 
      flex: 1; 
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.9); 
      border-radius: 10px; 
      padding: 8px 12px; 
      font-size: 12px; 
      outline: none; 
      transition: all 0.2s ease;
    }
    .comment-input:focus { border-color: #ff477e; background: #fff; }
    .comment-btn { 
      background: #ff477e; 
      color: #fff; 
      border: none; 
      padding: 6px 14px; 
      border-radius: 10px; 
      font-size: 12px; 
      cursor: pointer; 
      font-weight: 700; 
      box-shadow: 0 3px 8px rgba(255, 71, 126, 0.3);
    }

    /* ==================== 6. 弹窗与表单样式 ==================== */
    .modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0, 0, 0, 0.25); 
      backdrop-filter: blur(8px); 
      -webkit-backdrop-filter: blur(8px); 
      z-index: 200; 
      justify-content: center; 
      align-items: center; 
    }
    .modal-content { 
      background: rgba(255, 255, 255, 0.85); 
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      width: 90%; 
      max-width: 400px; 
      border-radius: 24px; 
      padding: 24px; 
      position: relative; 
      max-height: 85vh; 
      overflow-y: auto; 
    }
    .modal-header { 
      font-size: 17px; 
      font-weight: 800; 
      color: #ff477e; 
      margin-bottom: 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .close-btn { background: none; border: none; font-size: 22px; color: #aaa; cursor: pointer; }

    .input-box { 
      width: 100%; 
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.9); 
      border-radius: 12px; 
      padding: 12px 14px; 
      font-size: 14px; 
      margin-bottom: 14px; 
      outline: none; 
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      transition: border 0.2s;
    }
    .input-box:focus { border-color: #ff477e; }
    textarea.input-box { height: 100px; resize: none; }

    .btn-submit { 
      width: 100%; 
      background: linear-gradient(135deg, #ff758c, #ff477e); 
      color: white; 
      border: none; 
      padding: 12px; 
      border-radius: 12px; 
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
      box-shadow: 0 6px 16px rgba(255, 71, 126, 0.35); 
    }
        /* ==================== 7. 微信风聊天对话框样式 ==================== */
    .chat-box { 
      height: 280px; 
      overflow-y: auto; 
      background: rgba(245, 245, 245, 0.7); 
      border: 1px solid rgba(255, 255, 255, 0.8); 
      border-radius: 16px; 
      padding: 12px; 
      margin-bottom: 12px; 
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    /* 对方发送的消息（靠左） */
    .msg-row.other {
      align-self: flex-start;
      align-items: flex-start;
    }

    /* 我发送的消息（靠右） */
    .msg-row.me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-sender-name {
      font-size: 10px;
      color: #999;
      margin-bottom: 3px;
      padding: 0 4px;
    }

    .msg-bubble {
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
    }

    /* 对方气泡样式（左侧：白色） */
    .msg-row.other .msg-bubble {
      background: #ffffff;
      color: #333;
      border-top-left-radius: 2px;
      border: 1px solid rgba(0,0,0,0.05);
    }

    /* 自己气泡样式（右侧：粉色渐变/微信绿风） */
    .msg-row.me .msg-bubble {
      background: linear-gradient(135deg, #ff758c, #ff477e);
      color: #ffffff;
      border-top-right-radius: 2px;
    }

    /* Tab 选项卡 */
    .tab-bar { display: flex; border-bottom: 1px solid rgba(0,0,0,0.06); margin-bottom: 16px; }
    .tab-item { flex: 1; text-align: center; padding: 10px; font-size: 13px; color: #777; cursor: pointer; font-weight: 600; }
    .tab-item.active { color: #ff477e; font-weight: 800; border-bottom: 2px solid #ff477e; }

    .request-card { 
      background: rgba(255,255,255,0.7); 
      padding: 12px; 
      border-radius: 12px; 
      margin-bottom: 10px; 
      font-size: 13px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border: 1px solid rgba(255,255,255,0.8); 
    }
    .sm-btn { padding: 5px 12px; border-radius: 8px; border: none; font-size: 11px; cursor: pointer; font-weight: 700; }
    .sm-btn-accept { background: #2ed573; color: #fff; }
    .sm-btn-reject { background: #ff4757; color: #fff; margin-left: 6px; }

    .chat-box { 
      height: 220px; 
      overflow-y: auto; 
      background: rgba(255,255,255,0.6); 
      border: 1px solid rgba(255,255,255,0.8); 
      border-radius: 12px; 
      padding: 12px; 
      margin-bottom: 12px; 
      font-size: 13px; 
    }
    .msg-item { margin-bottom: 10px; line-height: 1.4; }
    .msg-item.me { text-align: right; color: #ff477e; font-weight: 600; }
  </style>
</head>
<body>

  <!-- 顶部玻璃导航栏 -->
  <header>
    <div class="user-profile" onclick="changeUsername()" title="点击修改名字">
      <div class="user-avatar" id="avatarDisplay">👤</div>
      <span class="user-name-text" id="usernameDisplay">设置名字</span>
    </div>
    <div class="header-title">💌 宿州二中表白墙</div>
    <button class="chat-nav-btn" onclick="openChatModal()">💬 私信</button>
  </header>

  <!-- 列表区 -->
  <div class="wall-title">✨ 最新表白</div>
  <div id="postsContainer">加载中...</div>

  <!-- 悬浮发帖按钮 -->
  <button class="fab-btn" onclick="openPublishModal()" title="发布表白">✏️</button>

  <!-- 1. 发表白弹窗 -->
  <div id="publishModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>写表白 💕</span>
        <button class="close-btn" onclick="closePublishModal()">×</button>
      </div>
      <input type="text" id="targetInput" class="input-box" placeholder="TO: 想表白的对象">
      <textarea id="contentInput" class="input-box" placeholder="写下你的心动留言..."></textarea>
      <button class="btn-submit" onclick="addPost()">发送表白</button>
    </div>
  </div>

  <!-- 2. 私信中心弹窗 -->
  <div id="chatModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>私信中心 💬</span>
        <button class="close-btn" onclick="closeChatModal()">×</button>
      </div>
      <div class="tab-bar">
        <div class="tab-item active" id="tabRequests" onclick="switchTab('requests')">私信申请</div>
        <div class="tab-item" id="tabMessages" onclick="switchTab('messages')">我的聊天</div>
      </div>
      
      <!-- 申请列表板块 -->
      <div id="requestsPanel">
        <div id="requestsList" style="font-size:12px; color:#888;">加载中...</div>
      </div>

      <!-- 聊天对话板块 -->
      <div id="messagesPanel" style="display:none;">
        <select id="friendSelect" class="input-box" onchange="loadChatHistory()"></select>
        <div class="chat-box" id="chatHistory">请选择聊天对象</div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="chatInput" class="comment-input" placeholder="输入私信内容...">
          <button class="comment-btn" onclick="sendChatMessage()">发送</button>
        </div>
      </div>
    </div>
  </div>
    <script>
    // 1. 初始化 Supabase
    const SUPABASE_URL = 'https://nbldkyyqmnjeiwybihqy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ibGRreXlxbW5qZWl3eWJpaHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyODY0NDIsImV4cCI6MjEwMDg2MjQ0Mn0.UOwl033Ame7kMoo3aHqm44BW4IG4qHmtKDvh6DptPVs'; // ⚠️ 替换为你的真实 Key
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. 敏感词过滤与防 XSS
    const BAD_WORDS = ['草', '干', '傻逼', '垃圾', '死', '色情', '打架', '作弊'];
    function filterBadWords(text) {
      let filteredText = text || '';
      BAD_WORDS.forEach(word => {
        const reg = new RegExp(word, 'gi');
        filteredText = filteredText.replace(reg, '***');
      });
      return filteredText;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // 3. 用户身份设置
    let currentUser = localStorage.getItem('wall_username');

    function initUser() {
      if (!currentUser) {
        let name = prompt('欢迎来到表白墙！请设置你的专属昵称：', '');
        if (name && name.trim()) {
          currentUser = filterBadWords(name.trim());
        } else {
          currentUser = '热心同学' + Math.floor(Math.random() * 899 + 100);
        }
        localStorage.setItem('wall_username', currentUser);
      }
      updateUserUI();
    }

    function updateUserUI() {
      document.getElementById('usernameDisplay').innerText = currentUser;
      document.getElementById('avatarDisplay').innerText = currentUser.charAt(0).toUpperCase();
    }

    function changeUsername() {
      let newName = prompt('修改你的昵称：', currentUser);
      if (newName && newName.trim()) {
        currentUser = filterBadWords(newName.trim());
        localStorage.setItem('wall_username', currentUser);
        updateUserUI();
        alert('修改成功！');
        fetchPosts();
      }
    }

    // 4. 弹窗控制
    function openPublishModal() { document.getElementById('publishModal').style.display = 'flex'; }
    function closePublishModal() { document.getElementById('publishModal').style.display = 'none'; }

    function openChatModal() { 
      document.getElementById('chatModal').style.display = 'flex'; 
      loadRequests();
    }
    function closeChatModal() { document.getElementById('chatModal').style.display = 'none'; }

    function switchTab(tab) {
      if (tab === 'requests') {
        document.getElementById('tabRequests').classList.add('active');
        document.getElementById('tabMessages').classList.remove('active');
        document.getElementById('requestsPanel').style.display = 'block';
        document.getElementById('messagesPanel').style.display = 'none';
        loadRequests();
      } else {
        document.getElementById('tabMessages').classList.add('active');
        document.getElementById('tabRequests').classList.remove('active');
        document.getElementById('messagesPanel').style.display = 'block';
        document.getElementById('requestsPanel').style.display = 'none';
        loadFriends();
      }
    }

    // 5. 私信逻辑
    async function applyChat(targetUser) {
      if (targetUser === currentUser) {
        alert('不能给自己发私信哦！');
        return;
      }
      if (!confirm(`确定要向「${targetUser}」发起私信申请吗？`)) return;

      const { error } = await _supabase.from('chat_requests').insert([{
        from_user: currentUser,
        to_user: targetUser,
        status: 'pending'
      }]);

      if (error) {
        alert('申请发送失败: ' + error.message);
      } else {
        alert('申请已发送，等待对方同意！');
      }
    }

    async function loadRequests() {
      const listEl = document.getElementById('requestsList');
      const { data, error } = await _supabase.from('chat_requests')
        .select('*')
        .eq('to_user', currentUser)
        .eq('status', 'pending');

      if (error || !data || data.length === 0) {
        listEl.innerHTML = '暂无未处理的私信申请';
        return;
      }

      listEl.innerHTML = data.map(req => `
        <div class="request-card">
          <span><strong>${escapeHtml(req.from_user)}</strong> 请求私信</span>
          <div>
            <button class="sm-btn sm-btn-accept" onclick="handleRequest(${req.id}, 'accepted')">同意</button>
            <button class="sm-btn sm-btn-reject" onclick="handleRequest(${req.id}, 'rejected')">拒绝</button>
          </div>
        </div>
      `).join('');
    }

    async function handleRequest(id, newStatus) {
      await _supabase.from('chat_requests').update({ status: newStatus }).eq('id', id);
      loadRequests();
    }

    async function loadFriends() {
      const { data } = await _supabase.from('chat_requests')
        .select('*')
        .or(`and(from_user.eq.${currentUser},status.eq.accepted),and(to_user.eq.${currentUser},status.eq.accepted)`);

      const select = document.getElementById('friendSelect');
      select.innerHTML = '<option value="">选择聊天对象...</option>';

      if (data) {
        data.forEach(item => {
          const friend = item.from_user === currentUser ? item.to_user : item.from_user;
          select.innerHTML += `<option value="${friend}">${friend}</option>`;
        });
      }
    }

        async function loadChatHistory() {
      const friend = document.getElementById('friendSelect').value;
      const historyBox = document.getElementById('chatHistory');
      if (!friend) { historyBox.innerHTML = '<div style="text-align:center; color:#aaa; font-size:12px; padding-top:20px;">请选择聊天对象</div>'; return; }

      const { data } = await _supabase.from('chat_messages')
        .select('*')
        .or(`and(sender.eq.${currentUser},receiver.eq.${friend}),and(sender.eq.${friend},receiver.eq.${currentUser})`)
        .order('id', { ascending: true });

      if (!data || data.length === 0) {
        historyBox.innerHTML = '<div style="text-align:center; color:#aaa; font-size:12px; padding-top:20px;">暂无消息，开始聊两句吧~</div>';
        return;
      }

      historyBox.innerHTML = data.map(m => {
        const isMe = m.sender === currentUser;
        return `
          <div class="msg-row ${isMe ? 'me' : 'other'}">
            <span class="msg-sender-name">${escapeHtml(m.sender)}</span>
            <div class="msg-bubble">${escapeHtml(m.message)}</div>
          </div>
        `;
      }).join('');
      
      // 自动滚动到底部
      historyBox.scrollTop = historyBox.scrollHeight;
    }

    async function sendChatMessage() {
      const friend = document.getElementById('friendSelect').value;
      const input = document.getElementById('chatInput');
      let msg = input.value.trim();

      if (!friend || !msg) return;

      msg = filterBadWords(msg);
      await _supabase.from('chat_messages').insert([{
        sender: currentUser,
        receiver: friend,
        message: msg
      }]);

      input.value = '';
      loadChatHistory();
    }

    // 6. 发表白、点赞、评论逻辑
    async function addPost() {
      let target = document.getElementById('targetInput').value.trim();
      let content = document.getElementById('contentInput').value.trim();

      if (!target || !content) {
        alert('请填写完整信息！');
        return;
      }

      target = filterBadWords(target);
      content = filterBadWords(content);

      const { error } = await _supabase.from('posts').insert([{
        author: currentUser,
        username: currentUser,
        target: target,
        content: content,
        likes: 0
      }]);

      if (error) {
        alert('发帖失败: ' + error.message);
      } else {
        alert('发送成功！💕');
        document.getElementById('targetInput').value = '';
        document.getElementById('contentInput').value = '';
        closePublishModal();
        fetchPosts();
      }
    }
    // 北京时间格式化 (UTC+8)
    function formatBeijingTime(utcDateStr) {
      if (!utcDateStr) return '';
      const date = new Date(utcDateStr);
      if (isNaN(date.getTime())) return '';

      return date.toLocaleString('zh-CN', {
        timeZone: 'Asia/Shanghai',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
    }

    // 获取本地已点赞的帖子 ID 列表
    function getLikedPosts() {
      const liked = localStorage.getItem('wall_liked_posts');
      return liked ? JSON.parse(liked) : [];
    }

       // 1. 评论逻辑
    async function addComment(postId) {
      const input = document.getElementById(`commentInput_${postId}`);
      let content = input.value.trim();
      if (!content) return;

      content = filterBadWords(content);

      const { error } = await _supabase.from('comments').insert([{
        post_id: postId,
        username: currentUser,
        content: content
      }]);

      if (error) {
        alert('评论失败: ' + error.message);
        return;
      }

      input.value = '';
      await fetchPosts();
    }

    // 2. 点击评论作者快捷填充 @回复
    function prepareReply(postId, targetUser) {
      const input = document.getElementById(`commentInput_${postId}`);
      if (input) {
        input.value = `@${targetUser} `;
        input.focus();
      }
    }
    
    // 3. 防重复点赞逻辑
    async function likePost(id, currentLikes) {
      const likedPosts = getLikedPosts();

      if (likedPosts.includes(id)) {
        alert('你已经赞过这条表白啦！💕');
        return;
      }

      const { error } = await _supabase
        .from('posts')
        .update({ likes: (currentLikes || 0) + 1 })
        .eq('id', id);

      if (error) {
        alert('点赞失败: ' + error.message);
        return;
      }

      likedPosts.push(id);
      localStorage.setItem('wall_liked_posts', JSON.stringify(likedPosts));
      fetchPosts();
    }

    // 4. 渲染主列表（左上角 To，右下角：时间在前，发帖人在后）
    async function fetchPosts() {
      const container = document.getElementById('postsContainer');
      const likedPosts = getLikedPosts();

      const { data: posts, error } = await _supabase
        .from('posts')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        container.innerHTML = '加载失败，请检查数据库配置。';
        return;
      }

      if (!posts || posts.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#7d6e83; padding:30px; font-size:13px;">还没有人发表白，快来抢沙发吧！✨</div>';
        return;
      }

      const { data: comments } = await _supabase.from('comments').select('*').order('id', { ascending: true });

      container.innerHTML = posts.map(post => {
        const postComments = comments ? comments.filter(c => c.post_id === post.id) : [];
        const postAuthor = post.author || post.username || '热心同学';
        const isLiked = likedPosts.includes(post.id);

        // 渲染评论列表（包含评论时间 & 点击回复）
        const commentsHtml = postComments.map(c => {
          const commentAuthor = c.author || c.username || '热心同学';
          const commentTime = formatBeijingTime(c.created_at);
          return `
            <div class="comment-item" style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <span class="comment-author" onclick="prepareReply(${post.id}, '${escapeHtml(commentAuthor)}')">@${escapeHtml(commentAuthor)}</span>: 
                <span>${escapeHtml(c.content)}</span>
              </div>
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:10px; color:#bbb;">${commentTime}</span>
                ${commentAuthor !== currentUser ? `<button class="reply-btn" onclick="prepareReply(${post.id}, '${escapeHtml(commentAuthor)}')">回复</button>` : ''}
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="post-card">
            <!-- 头部：左上角放表白对象 (To: xxx) -->
            <div class="post-header" style="justify-content: flex-start;">
              <span class="post-target">To: ${escapeHtml(post.target)}</span>
            </div>
            
            <div class="post-content">${escapeHtml(post.content)}</div>
            
            <!-- 底部：左侧点赞，右侧：时间在前，发帖人在后 -->
            <div class="post-footer">
              <button class="action-btn" style="${isLiked ? 'background:rgba(255,182,193,0.8); color:#d6336c;' : ''}" onclick="likePost(${post.id}, ${post.likes || 0})">
                ${isLiked ? '❤️ 已赞' : '❤️ 点赞'} (${post.likes || 0})
              </button>
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:11px; color:#aaa;">${formatBeijingTime(post.created_at)}</span>
                <span class="post-author" onclick="applyChat('${escapeHtml(postAuthor)}')">From: @${escapeHtml(postAuthor)}</span>
              </div>
            </div>
            
            <!-- 评论区 -->
            <div class="comments-section">
              <div id="commentList_${post.id}">
                ${commentsHtml || '<div style="font-size:11px; color:#bbb;">暂无评论，快来互动吧...</div>'}
              </div>
              <div class="comment-input-group">
                <input type="text" id="commentInput_${post.id}" class="comment-input" placeholder="写下你的评论...">
                <button class="comment-btn" onclick="addComment(${post.id})">发送</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 7. 初始化启动
    window.onload = function() {
      initUser();
      fetchPosts();
    };
  </script>
</body>
</html>

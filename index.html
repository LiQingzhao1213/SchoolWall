  <script>
    /* ============================================================
       🔊 iOS 音效 & 触觉反馈
       ============================================================ */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playIosClickSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
        osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.03);
      } catch(e){}
    }
    function playIosHapticSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(160, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.4, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.08);
        if (navigator.vibrate) navigator.vibrate(15);
      } catch(e){}
    }

    /* ============================================================
       🍏 iOS 加载动画控制
       ============================================================ */
    function showLoadingOverlay(label) {
      const overlay = document.getElementById('iosLoadingOverlay');
      const labelEl = document.getElementById('loadingLabel');
      if (label) labelEl.textContent = label; else labelEl.textContent = '载入中…';
      overlay.classList.remove('hidden');
    }
    function hideLoadingOverlay() {
      document.getElementById('iosLoadingOverlay').classList.add('hidden');
    }

    /* ============================================================
       🔐 加密与认证（安全增强）
       ============================================================ */
    async function hashPassword(uid, rawPassword) {
      const data = new TextEncoder().encode(uid + "_SALT_SECURE_2026_" + rawPassword);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    function generate6DigitUid() {
      return String(Math.floor(100000 + Math.random() * 900000));
    }

    function switchAuthTab(type) {
      playIosClickSound();
      if (type === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabRegister').classList.remove('active');
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
      } else {
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('loginForm').style.display = 'none';
      }
    }

    // 密码强度校验
    function validatePasswordStrength(pass) {
      if (pass.length < 8) return '密码长度不能少于 8 位';
      if (!/[a-zA-Z]/.test(pass) || !/\d/.test(pass)) return '密码必须同时包含字母和数字';
      return null;
    }

    async function handleAuthSubmit(event, type) {
      event.preventDefault();
      playIosClickSound();

      if (type === 'register') {
        const name = document.getElementById('regName').value.trim();
        const pass1 = document.getElementById('regPassword').value;
        const pass2 = document.getElementById('regConfirmPassword').value;

        if (!name) { showIosAlert("失败","请输入你的名字/昵称！",false); return; }
        if (pass1 !== pass2) { showIosAlert("失败","两次输入的密码不相同！",false); return; }
        const pwdErr = validatePasswordStrength(pass1);
        if (pwdErr) { showIosAlert("失败", pwdErr, false); return; }

        showLoadingOverlay('正在创建账号…');
        let newUid = generate6DigitUid();
        const hashedPassword = await hashPassword(newUid, pass1);

        const { error } = await _supabase.from('profiles').insert([{
          uid: newUid, username: name, password_hash: hashedPassword,
          avatar: DEFAULT_AVATAR, bio: '暂无简介...', is_admin: false
        }]);

        hideLoadingOverlay();
        if (error) { showIosAlert("失败", "注册失败：" + (error.message || "未知错误"), false); return; }

        currentUser = { uid: newUid, name, avatar: DEFAULT_AVATAR, bio: '暂无简介...', isAdmin: false };
        saveUserDataToLocal();
        document.getElementById('authOverlay').style.display = 'none';
        showIosAlert("成功", `注册成功！你的登录 UID 为：${newUid}\n请牢记此 UID！`, false);
        updateProfileUI(); fetchPosts(); setupGlobalMessageListener();

      } else if (type === 'login') {
        const uid = document.getElementById('loginUid').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!uid) { showIosAlert("失败","UID 不能为空！",false); return; }
        if (uid.length !== 6 || !/^\d{6}$/.test(uid)) { showIosAlert("失败","请输入正确的 6 位 UID！",false); return; }
        const pwdErr = validatePasswordStrength(password);
        if (pwdErr) { showIosAlert("失败", pwdErr, false); return; }

        showLoadingOverlay('正在验证身份…');
        const hashedPassword = await hashPassword(uid, password);

        // 🔒 安全增强：通过 RPC 函数查询，避免直接暴露表结构
        const { data, error } = await _supabase.rpc('get_user_by_uid', { uid_input: uid });

        hideLoadingOverlay();
        if (error) { showIosAlert("失败","网络或服务器错误：" + error.message, false); return; }
        if (!data || data.length === 0) { showIosAlert("失败","未找到该 UID 账号！",false); return; }

        const user = data[0];
        if (!user.password_hash) {
          showIosAlert("失败","该账号是密码系统上线前创建的，请先联系管理员初始化密码，或使用注册功能新建账号。",false);
          return;
        }
        if (user.password_hash !== hashedPassword) { showIosAlert("失败","密码错误，请重新输入！",false); return; }

        currentUser = {
          uid: user.uid, name: user.username || '用户_' + user.uid,
          avatar: user.avatar || DEFAULT_AVATAR, bio: user.bio || '暂无简介...',
          isAdmin: user.is_admin === true || user.is_admin === 'true'
        };
        saveUserDataToLocal();
        document.getElementById('authOverlay').style.display = 'none';
        updateProfileUI(); fetchPosts(); setupGlobalMessageListener(); renderChatList();
      }
    }

    function logoutUser() {
      showIosAlert("确认退出？","退出登录后需要重新填写 UID 与密码登录。",false, () => {
        localStorage.removeItem('forum_user_uid'); localStorage.removeItem('forum_username');
        localStorage.removeItem('forum_user_avatar'); localStorage.removeItem('forum_user_bio');
        localStorage.removeItem('forum_is_admin'); localStorage.removeItem('total_unread_count');
        location.reload();
      });
    }

    /* ============================================================
       ⚙️ Supabase 初始化
       ============================================================ */
    const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23e5e5ea'/%3E%3Ccircle cx='50' cy='38' r='18' fill='%238e8e93'/%3E%3Cpath d='M20,85 C20,65 33,56 50,56 C67,56 80,65 80,85 Z' fill='%238e8e93'/%3E%3C/svg%3E";

    /* ============================================================
       🔐 三重加密 Supabase 凭据（源码中无明文）
       Layer1: Base64  encode
       Layer2: 字符串反转
       Layer3: XOR 逐字符混淆（key = 'SZ2Z_2026_CAMPUS'）
       ============================================================ */
    function _d1(b64){return atob(b64);}
    function _d2(s){return s.split('').reverse().join('');}
    function _d3(s){var k='SZ2Z_2026_CAMPUS',o='';for(var i=0;i<s.length;i++){o+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));}return o;}

    // 加密后的 URL 与 KEY（运行时解密，源码/DevTools 里只能看到乱码）
    var _eURL = "XVMcOilTODIjICNjODI3X1BJRTY/WDQ+IiwpJiUvPVgdHwgsKkYuOw==";
    var _eKEY = "IAMAOTEHaV5EdHkrN3orZxQcZBoDd2tbQ3hTbDVdFzhkMD0McnBvWkV/Z3FqXBdjAj8dfyYHEkF3Wn9pE3E5ZwU4GT4IBxEGa3R9Jg92FWAWPx8kEBsGRnhzfjZuADgmFTgZewgQBUULXVE2LVsTZhUdMT0LFDoFXmdoLm9lOCs/DTU/EwQ9Xwdde2kTWwA/GTsZPggQBUx0XWs3GGo+KRk8HyQMcDxGeElXcWN4GQULJTsEdwocVQdiXBYpezMdYhwqGAgJNnlbU3U9MngjNg==";

    function getSupabaseConfig(){
      var url = _d3(_d2(_d1(_eURL)));
      var key = _d3(_d2(_d1(_eKEY)));
      return { url: url, key: key };
    }

    var _cfg = getSupabaseConfig();
    const SUPABASE_URL = _cfg.url;
    const SUPABASE_KEY = _cfg.key;
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      realtime: { params: { eventsPerSecond: 10 } }
    });

    /* ============================================================
       🌐 全局状态
       ============================================================ */
    let currentUser = {
      uid: localStorage.getItem('forum_user_uid') || null,
      name: localStorage.getItem('forum_username') || '',
      avatar: localStorage.getItem('forum_user_avatar') || DEFAULT_AVATAR,
      bio: localStorage.getItem('forum_user_bio') || '暂无简介...',
      isAdmin: localStorage.getItem('forum_is_admin') === 'true'
    };

    let myLikedPostsMap = JSON.parse(localStorage.getItem('forum_liked_posts') || '{}');
    let selectedBase64Image = null;
    let selectedAvatarBase64 = null;
    let allPostsData = [];
    let allCommentsData = [];
    let userProfilesMap = new Map();

    let activeChatTargetUid = null;
    let pendingReplyIdx = null; // 正在回复的消息索引
    let localChatData = JSON.parse(localStorage.getItem('forum_local_chats') || '{}');
    let globalMessageChannel = null;
    let messageSubscription = null;

    /* ============================================================
       📜 滚动隐藏导航
       ============================================================ */
    let lastScrollY = window.scrollY;
    window.addEventListener('scroll', () => {
      const cy = window.scrollY;
      const headerEl = document.getElementById('forumSearchBar');
      const fabBtnEl = document.getElementById('mainFabBtn');
      const dockBarEl = document.getElementById('mainDockBar');
      if (cy - lastScrollY > 15 && cy > 50) {
        headerEl?.classList.add('scroll-hidden');
        fabBtnEl?.classList.add('scroll-hidden');
        dockBarEl?.classList.add('scroll-hidden');
      } else if (lastScrollY - cy > 15 || cy <= 20) {
        headerEl?.classList.remove('scroll-hidden');
        fabBtnEl?.classList.remove('scroll-hidden');
        dockBarEl?.classList.remove('scroll-hidden');
      }
      lastScrollY = cy;
    }, { passive: true });

    function handleAvatarError(imgObj) { imgObj.onerror = null; imgObj.src = DEFAULT_AVATAR; }

    async function syncUserProfileToDb() {
      if (!currentUser.uid) return;
      await _supabase.from('profiles').upsert([{
        uid: String(currentUser.uid), username: currentUser.name,
        avatar: currentUser.avatar, bio: currentUser.bio, is_admin: currentUser.isAdmin
      }], { onConflict: 'uid' });
    }

    function saveUserDataToLocal() {
      if (currentUser.uid) localStorage.setItem('forum_user_uid', currentUser.uid);
      localStorage.setItem('forum_username', currentUser.name);
      localStorage.setItem('forum_user_avatar', currentUser.avatar);
      localStorage.setItem('forum_user_bio', currentUser.bio);
      localStorage.setItem('forum_is_admin', currentUser.isAdmin);
      localStorage.setItem('forum_liked_posts', JSON.stringify(myLikedPostsMap));
    }

    function updateProfileUI() {
      document.getElementById('myNameDisplay').innerText = currentUser.name || '--';
      document.getElementById('myUidDisplay').innerText = currentUser.uid || '------';
      document.getElementById('myAvatarDisplay').src = currentUser.avatar || DEFAULT_AVATAR;
      document.getElementById('myBioDisplay').innerText = currentUser.bio || '暂无简介...';
      document.getElementById('adminStatusTag').style.display = currentUser.isAdmin ? 'inline-block' : 'none';
    }

    /* ============================================================
       🔔 Toast 通知
       ============================================================ */
    function showToast(msg, autoHideMs, onClick) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast-notification' + (onClick ? ' clickable' : '');
      toast.textContent = msg;
      toast.onclick = () => { if (onClick) onClick(); hideToast(toast); };
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      if (autoHideMs) setTimeout(() => hideToast(toast), autoHideMs);
    }
    function hideToast(toast) {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }

    /* ============================================================
       👤 用户主页弹窗
       ============================================================ */
    function openUserProfileModal(targetUid, targetName) {
      playIosClickSound();
      const profile = userProfilesMap.get(String(targetUid)) || userProfilesMap.get(String(targetName)) || {};
      const uid = targetUid || profile.uid || '未知';
      const name = profile.username || targetName || '用户_' + uid;
      document.getElementById('modalUserAvatar').src = profile.avatar || DEFAULT_AVATAR;
      document.getElementById('modalUserName').innerText = name;
      document.getElementById('modalUserUid').innerText = uid;
      document.getElementById('modalUserBio').innerText = profile.bio || '暂无简介...';
      const chatBtn = document.getElementById('modalStartChatBtn');
      if (String(uid) === String(currentUser.uid)) {
        chatBtn.style.display = 'none';
      } else {
        chatBtn.style.display = 'inline-flex';
        chatBtn.onclick = function() {
          playIosClickSound(); closeUserProfileModal();
          if (!localChatData[uid]) localChatData[uid] = [];
          localStorage.setItem('forum_local_chats', JSON.stringify(localChatData));
          switchMainTab('chat', 1); openChatDialog(uid);
        };
      }
      document.getElementById('userProfileModal').style.display = 'flex';
    }
    function closeUserProfileModal() { document.getElementById('userProfileModal').style.display = 'none'; }

    /* ============================================================
       🚨 Alert & ActionSheet
       ============================================================ */
    let iosAlertCallback = null;
    function showIosAlert(title, desc, isInputMode, onConfirm) {
      playIosClickSound();
      document.getElementById('iosAlertTitle').innerText = title;
      document.getElementById('iosAlertDesc').innerText = desc || '';
      const inputEl = document.getElementById('iosAlertInput');
      inputEl.style.display = isInputMode ? 'block' : 'none';
      if (isInputMode) inputEl.value = '';
      iosAlertCallback = onConfirm;
      document.getElementById('iosAlertModal').style.display = 'flex';
    }
    function closeIosAlertModal() { document.getElementById('iosAlertModal').style.display = 'none'; iosAlertCallback = null; }
    document.getElementById('iosAlertConfirmBtn').onclick = function() {
      playIosClickSound();
      const v = document.getElementById('iosAlertInput').value;
      if (iosAlertCallback) iosAlertCallback(v);
      closeIosAlertModal();
    };

    async function openDevAuthModal() {
      if (currentUser.isAdmin) { showIosAlert("提示","你当前已经是开发者管理员！",false); return; }
      showIosAlert("开发者授权","请输入开发者专属校验秘钥：",true, async (inputKey) => {
        if (!inputKey) return;
        // 🔒 常量时间比较防时序攻击
        const { data: isValid, error } = await _supabase.rpc('verify_dev_secret', { input_key: inputKey });
        if (error) { showIosAlert("错误","校验请求失败",false); return; }
        if (isValid) {
          currentUser.isAdmin = true;
          localStorage.setItem('forum_is_admin', 'true');
          await syncUserProfileToDb();
          showIosAlert("成功","已获得最高开发者权限。",false, () => location.reload());
        } else {
          showIosAlert("失败","秘钥错误！",false);
        }
      });
    }

    function openActionSheet(options) {
      const container = document.getElementById('actionSheetOptions');
      container.innerHTML = options.map(opt => `<button class="ios-sheet-btn ${opt.danger?'danger':''}" onclick="playIosClickSound();closeActionSheet();${opt.action};">${opt.label}</button>`).join('');
      document.getElementById('iosActionSheet').style.display = 'flex';
    }
    function closeActionSheet() { document.getElementById('iosActionSheet').style.display = 'none'; }

    /* ============================================================
       📑 底部 Tab 切换
       ============================================================ */
    function switchMainTab(tab, index) {
      document.querySelectorAll('.page-tab').forEach(el => el.classList.remove('active-page'));
      const target = document.getElementById(tab + 'Page');
      if (target) target.classList.add('active-page');
      document.getElementById('forumSearchBar').style.display = tab === 'forum' ? 'block' : 'none';
      document.getElementById('mainFabBtn').style.display = tab === 'forum' ? 'flex' : 'none';
      const indicator = document.getElementById('dockIndicator');
      if (indicator) indicator.style.transform = `translateX(${index*100}%)`;
      document.querySelectorAll('.dock-item').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('dock' + tab.charAt(0).toUpperCase() + tab.slice(1));
      if (activeBtn) activeBtn.classList.add('active');

      if (tab === 'forum') fetchPosts();
      if (tab === 'chat') renderChatList();
      if (tab === 'profile') fetchMyPosts();
    }

    /* ============================================================
       💬 私信系统（核心改造）
       ============================================================ */
    // 长按菜单
    let longPressTimer = null, isLongPressTriggered = false;
    function bindLongPressEvents(el, uid) {
      const start = () => { isLongPressTriggered = false; clearTimeout(longPressTimer); longPressTimer = setTimeout(() => { isLongPressTriggered = true; playIosHapticSound(); openChatUserContextMenu(uid); }, 400); };
      const cancel = () => clearTimeout(longPressTimer);
      el.addEventListener('touchstart', start, {passive:true}); el.addEventListener('touchend', cancel); el.addEventListener('touchmove', cancel);
      el.addEventListener('mousedown', start); el.addEventListener('mouseup', cancel); el.addEventListener('mouseleave', cancel);
    }
    function handleChatClick(uid) {
      if (isLongPressTriggered) { isLongPressTriggered = false; return; }
      playIosClickSound(); openChatDialog(uid);
    }

    function openChatUserContextMenu(targetUid) {
      const profile = userProfilesMap.get(String(targetUid)) || {};
      const name = profile.username || '用户_' + targetUid;
      openActionSheet([
        { label: `<svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-broom"></use></svg> 清空与 ${escapeHtml(name)} 的聊天记录`, danger: true, action: `confirmClearChatHistory('${targetUid}')` },
        { label: `<svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-trash"></use></svg> 删除联系人 ${escapeHtml(name)}`, danger: true, action: `confirmRemoveChatUser('${targetUid}')` }
      ]);
    }

    function confirmClearChatHistory(uid) {
      const profile = userProfilesMap.get(String(uid)) || {};
      const name = profile.username || '用户_' + uid;
      showIosAlert("确认清空记录？","将抹除你与 " + name + " 的所有聊天记录。",false, () => {
        localChatData[uid] = [];
        localStorage.setItem('forum_local_chats', JSON.stringify(localChatData));
        renderChatList();
      });
    }

    function confirmRemoveChatUser(uid) {
      const profile = userProfilesMap.get(String(uid)) || {};
      const name = profile.username || '用户_' + uid;
      showIosAlert("确认删除此联系人？","将从列表中移除 " + name + " 并清除记录。",false, () => {
        delete localChatData[uid];
        localStorage.setItem('forum_local_chats', JSON.stringify(localChatData));
        renderChatList();
      });
    }

    // 骨架屏
    function renderChatSkeleton() {
      const c = document.getElementById('chatFriendsContainer');
      c.innerHTML = Array(3).fill(0).map(() => `<div class="ios-skeleton-card"><div class="skeleton-avatar shimmer"></div><div class="skeleton-info"><div class="skeleton-line short shimmer"></div><div class="skeleton-line long shimmer"></div></div></div>`).join('');
    }

    // 渲染私信列表 + 红点
    async function renderChatList() {
      renderChatSkeleton();
      await loadUserProfilesMap();
      const container = document.getElementById('chatFriendsContainer');
      const uids = Object.keys(localChatData);

      if (uids.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#8e8e93; font-size:12px;">暂无私信记录，输入 UID 查找吧</div>';
        updateNavBadge(0);
        return;
      }

      let totalUnread = 0;
      container.innerHTML = '';
      uids.forEach(uid => {
        const profile = userProfilesMap.get(String(uid)) || {};
        const msgs = localChatData[uid] || [];
        const unread = msgs.filter(m => m.sender === 'other' && !m.isRead).length;
        totalUnread += unread;
        const lastMsg = msgs.length > 0 ? msgs[msgs.length-1].text : '暂无聊天内容...';
        const lastTime = msgs.length > 0 ? msgs[msgs.length-1].time : '';
        const card = document.createElement('div');
        card.className = 'chat-item-card' + (unread > 0 ? ' has-unread' : '');
        card.innerHTML = `
          <div class="chat-avatar-wrapper">
            <img class="chat-item-avatar" src="${profile.avatar || DEFAULT_AVATAR}" onerror="handleAvatarError(this)">
            ${unread > 0 ? `<div class="unread-badge">${unread>99?'99+':unread}</div>` : ''}
          </div>
          <div class="chat-item-info">
            <div class="chat-item-name ${unread>0?'unread-name':''}">${escapeHtml(profile.username || '用户_'+uid)}</div>
            <div class="chat-item-lastmsg ${unread>0?'unread-msg':''}">${escapeHtml(lastMsg)}</div>
          </div>
          <div class="chat-item-time ${unread>0?'unread-time':''}">${lastTime ? formatBeijingTime(lastTime) : ''}</div>
        `;
        bindLongPressEvents(card, uid);
        card.onclick = () => handleChatClick(uid);
        container.appendChild(card);
      });

      updateNavBadge(totalUnread);
    }

    // 🔴 底部导航红点（修正位置）
    function updateNavBadge(totalUnread) {
      if (totalUnread === undefined) {
        totalUnread = parseInt(localStorage.getItem('total_unread_count') || '0');
      } else {
        localStorage.setItem('total_unread_count', String(totalUnread));
      }
      const badge = document.getElementById('chatNavBadge');
      if (!badge) return;
      if (totalUnread > 0) {
        badge.textContent = totalUnread > 99 ? '99+' : String(totalUnread);
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    async function searchAndStartChat() {
      const uidInput = document.getElementById('chatSearchUidInput').value.trim();
      if (!uidInput) { showIosAlert("提示","请输入需要查找的 UID！",false); return; }
      if (!/^\d{6}$/.test(uidInput)) { showIosAlert("格式错误","UID 必须为 6 位数字！",false); return; }
      if (uidInput === String(currentUser.uid)) { showIosAlert("提示","不能给自己发送私信！",false); return; }

      showLoadingOverlay('正在查找用户…');
      await loadUserProfilesMap();
      const target = userProfilesMap.get(uidInput);
      hideLoadingOverlay();

      if (!target) { showIosAlert("查找失败","未找到该 UID 的用户！",false); return; }
      if (!localChatData[uidInput]) { localChatData[uidInput] = []; localStorage.setItem('forum_local_chats', JSON.stringify(localChatData)); }
      document.getElementById('chatSearchUidInput').value = '';
      openChatDialog(uidInput);
    }

    function openChatDialog(targetUid) {
      activeChatTargetUid = String(targetUid);
      const profile = userProfilesMap.get(activeChatTargetUid) || {};
      // 顶部名字 + 头像（与消息里显示的一致）
      document.getElementById('targetChatName').innerText = profile.username || '用户_' + activeChatTargetUid;
      const av = document.getElementById('targetChatAvatar');
      av.src = profile.avatar || DEFAULT_AVATAR;
      // 进入聊天模式：隐藏底部导航/搜索/FAB
      document.body.classList.add('chat-mode');
      document.getElementById('chatListView').style.display = 'none';
      document.getElementById('chatDialogView').style.display = 'block';
      // 重置回复状态
      pendingReplyIdx = null;
      document.getElementById('replyPreviewBar').classList.remove('active');
      // 标记已读 + 更新双钩
      markMessagesAsRead(activeChatTargetUid);
      renderChatMessages();
    }

    function backToChatList() {
      activeChatTargetUid = null;
      document.body.classList.remove('chat-mode');
      document.getElementById('chatDialogView').style.display = 'none';
      document.getElementById('chatListView').style.display = 'block';
      renderChatList();
    }

    // 渲染消息气泡（带头像/名字/回复引用/右下角时间+已读）
    function renderChatMessages() {
      if (!activeChatTargetUid) return;
      const box = document.getElementById('chatMessagesBox');
      const msgs = localChatData[activeChatTargetUid] || [];

      if (msgs.length === 0) {
        box.innerHTML = '<div style="text-align:center; color:#8e8e93; font-size:11px; margin-top:20px;">打个招呼吧 ~</div>';
        return;
      }

      // 解析名字 + 头像
      const meProfile = { name: currentUser.name || '我', avatar: currentUser.avatar || DEFAULT_AVATAR };
      const otherProfile = userProfilesMap.get(String(activeChatTargetUid)) || { username: '', avatar: '' };
      const otherName = otherProfile.username || ('用户_' + activeChatTargetUid);
      const otherAvatar = otherProfile.avatar || DEFAULT_AVATAR;

      box.innerHTML = msgs.map((m, idx) => {
        const isMe = m.sender === 'me';
        const timeStr = m.time ? new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
        const senderName = isMe ? meProfile.name : otherName;
        const senderAvatar = isMe ? meProfile.avatar : otherAvatar;

        // 已读状态
        let statusHtml = '';
        if (isMe) {
          statusHtml = m.isRead
            ? `<span class="tg-read-status read"><svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-check-double"></use></svg></span>`
            : `<span class="tg-read-status sent"><svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-check-single"></use></svg></span>`;
        }

        // 回复引用块
        let replyHtml = '';
        if (m.replyToIdx != null && msgs[m.replyToIdx]) {
          const rm = msgs[m.replyToIdx];
          const rn = rm.sender === 'me' ? meProfile.name : otherName;
          replyHtml = `<div class="msg-reply-quote" onclick="scrollToMessage(${m.replyToIdx})">
            <span class="msg-reply-author">← ${escapeHtml(rn)}</span>
            <span class="msg-reply-text">${escapeHtml(rm.text||'')}</span>
          </div>`;
        }

        return `
          <div class="msg-row ${isMe?'me':'other'}" id="msg-row-${idx}">
            <img class="msg-avatar" src="${senderAvatar}" onerror="handleAvatarError(this)">
            <div class="msg-stack">
              <div class="msg-sender-name">${escapeHtml(senderName)}</div>
              <div class="msg-bubble ${isMe?'me':'other'}" oncontextmenu="event.preventDefault();playIosHapticSound();openMessageMenu(${idx});" ontouchstart="msgTouchStart(${idx})" ontouchend="msgTouchEnd()" onclick="playIosClickSound();">
                ${replyHtml}
                <span>${escapeHtml(m.text)}</span>
                <div class="msg-meta-bar">
                  <span>${timeStr}</span>
                  ${statusHtml}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    // 长按检测（≥400ms 才弹菜单，单击不弹）
    var msgTouchTimer = null;
    function msgTouchStart(idx){
      msgTouchTimer = setTimeout(()=>{
        playIosHapticSound();
        openMessageMenu(idx);
        msgTouchTimer = null;
      }, 450);
    }
    function msgTouchEnd(){ if(msgTouchTimer){clearTimeout(msgTouchTimer); msgTouchTimer=null;} }

    // 丝滑滚动到目标消息 + 高亮闪烁
    function scrollToMessage(idx){
      const el = document.getElementById('msg-row-'+idx);
      if(!el) return;
      el.scrollIntoView({behavior:'smooth', block:'center'});
      const bubble = el.querySelector('.msg-bubble');
      if(bubble){ bubble.classList.remove('highlight'); void bubble.offsetWidth; bubble.classList.add('highlight'); }
    }

    function openMessageMenu(msgIndex) {
      const msgs = localChatData[activeChatTargetUid] || [];
      const msg = msgs[msgIndex];
      if (!msg) return;
      const options = [];
      // 回复该消息（长按后出现的首要操作）
      options.push({ label: `<svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-undo"></use></svg> 回复该消息`, action: `beginReply(${msgIndex})` });
      if (msg.sender === 'me') options.push({ label: `<svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-undo"></use></svg> 撤回并重新编辑`, action: `recallMessage(${msgIndex})` });
      options.push({ label: `<svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-trash"></use></svg> 删除该消息`, danger: true, action: `deleteMessage(${msgIndex})` });
      openActionSheet(options);
    }

    // 进入回复模式：显示预览条 + 聚焦输入框
    function beginReply(idx){
      const msgs = localChatData[activeChatTargetUid] || [];
      const m = msgs[idx]; if(!m) return;
      const isMe = m.sender === 'me';
      const otherProfile = userProfilesMap.get(String(activeChatTargetUid)) || {};
      const name = isMe ? (currentUser.name||'我') : (otherProfile.username || ('用户_'+activeChatTargetUid));
      const avatar = isMe ? (currentUser.avatar||DEFAULT_AVATAR) : (otherProfile.avatar || DEFAULT_AVATAR);
      document.getElementById('replyPrevName').textContent = '回复 ' + name;
      document.getElementById('replyPrevText').textContent = m.text || '';
      document.getElementById('replyPrevAvatar').src = avatar;
      document.getElementById('replyPreviewBar').classList.add('active');
      pendingReplyIdx = idx;
      setTimeout(()=>{ const inp=document.getElementById('chatMsgInput'); if(inp) inp.focus(); }, 100);
    }
    function cancelReply(){
      pendingReplyIdx = null;
      document.getElementById('replyPreviewBar').classList.remove('active');
    }

    function recallMessage(idx) {
      const msgs = localChatData[activeChatTargetUid];
      if (!msgs || !msgs[idx]) return;
      const recalled = msgs[idx].text;
      msgs.splice(idx, 1);
      localStorage.setItem('forum_local_chats', JSON.stringify(localChatData));
      document.getElementById('chatMsgInput').value = recalled;
      document.getElementById('chatMsgInput').focus();
      renderChatMessages();
    }

    function deleteMessage(idx) {
      showIosAlert("确认删除消息？","将抹除该条消息记录。",false, () => {
        const msgs = localChatData[activeChatTargetUid];
        if (msgs) { msgs.splice(idx, 1); localStorage.setItem('forum_local_chats', JSON.stringify(localChatData)); renderChatMessages(); }
      });
    }

    function sendPrivateMsg() {
      const input = document.getElementById('chatMsgInput');
      const text = input.value.trim();
      if (!text || !activeChatTargetUid) return;

      if (!localChatData[activeChatTargetUid]) localChatData[activeChatTargetUid] = [];

      localChatData[activeChatTargetUid].push({
        sender: 'me', text, time: new Date().toISOString(), isRead: false,
        replyToIdx: pendingReplyIdx != null ? pendingReplyIdx : null
      });
      localStorage.setItem('forum_local_chats', JSON.stringify(localChatData));
      input.value = '';
      // 发送后清除回复状态
      pendingReplyIdx = null;
      document.getElementById('replyPreviewBar').classList.remove('active');
      renderChatMessages();

      // 同时写入数据库（服务端存储 + 实时推送）
      _supabase.from('messages').insert([{
        sender_uid: String(currentUser.uid), receiver_uid: activeChatTargetUid,
        content: text, is_read: false
      }]).then(() => {
        // 刷新左侧列表预览
        renderChatList();
      });
    }

    // 加号按钮（语音位）：弹出轻菜单
    function onPlusClicked(){
      playIosClickSound();
      openActionSheet([
        { label: `<svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-plus"></use></svg> 发送图片`, action: `showToast('图片功能开发中',2000)` },
        { label: `<svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-bolt"></use></svg> 发送文件`, action: `showToast('文件功能开发中',2000)` }
      ]);
    }

    // 🔒 标记已读（触发双钩变化）
    function markMessagesAsRead(targetUid) {
      const msgs = localChatData[targetUid];
      if (!msgs || msgs.length === 0) return;
      let changed = false;
      msgs.forEach(m => { if (m.sender === 'other' && !m.isRead) { m.isRead = true; changed = true; } });
      if (changed) {
        localStorage.setItem('forum_local_chats', JSON.stringify(localChatData));
        // 更新数据库
        _supabase.from('messages').update({ is_read: true })
          .match({ sender_uid: targetUid, receiver_uid: String(currentUser.uid), is_read: false })
          .then(() => {
            // 通知对方（通过实时通道）
            renderChatMessages(); // 刷新双钩显示
            renderChatList();    // 刷新红点
          });
      }
    }

    /* ============================================================
       📡 Realtime 全局消息监听（红点 + 双钩实时更新）
       ============================================================ */
    function setupGlobalMessageListener() {
      if (!currentUser || !currentUser.uid) return;
      if (globalMessageChannel) _supabase.removeChannel(globalMessageChannel);

      globalMessageChannel = _supabase
        .channel('global-msg-' + currentUser.uid)
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'messages', filter: `receiver_uid=eq.${currentUser.uid}` },
          (payload) => handleNewIncomingMessage(payload.new)
        )
        .on('postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'messages', filter: `sender_uid=eq.${currentUser.uid}` },
          (payload) => {
            // 对方标记已读 → 更新本地双钩
            const updated = payload.new;
            const targetUid = updated.receiver_uid;
            const msgs = localChatData[targetUid];
            if (msgs) {
              const msg = msgs.find(m => m.text === updated.content && m.sender === 'me' && !m.isRead);
              if (msg) { msg.isRead = true; localStorage.setItem('forum_local_chats', JSON.stringify(localChatData)); }
            }
            if (activeChatTargetUid === targetUid) renderChatMessages();
            renderChatList();
          }
        )
        .subscribe();
    }

    function handleNewIncomingMessage(msg) {
      const fromUid = msg.sender_uid;
      if (!localChatData[fromUid]) localChatData[fromUid] = [];
      localChatData[fromUid].push({
        sender: 'other', text: msg.content, time: msg.created_at || new Date().toISOString(), isRead: false
      });
      localStorage.setItem('forum_local_chats', JSON.stringify(localChatData));

      if (activeChatTargetUid === fromUid) {
        // 当前正在对话 → 自动标记已读
        markMessagesAsRead(fromUid);
      } else {
        // 不在对话 → 红点 + Toast
        const total = parseInt(localStorage.getItem('total_unread_count') || '0') + 1;
        localStorage.setItem('total_unread_count', String(total));
        const profile = userProfilesMap.get(String(fromUid)) || {};
        showToast(`📨 来自 ${profile.username || fromUid} 的新消息`, 3000, () => {
          switchMainTab('chat', 1); openChatDialog(fromUid);
        });
      }
      renderChatList();
    }

    // 轮询兜底（防 WebSocket 断连）
    setInterval(() => { if (currentUser && currentUser.uid) renderChatList(); }, 15000);

    /* ============================================================
       📝 帖子与评论
       ============================================================ */
    async function loadUserProfilesMap() {
      const { data } = await _supabase.from('profiles').select('*');
      userProfilesMap.clear();
      if (data) data.forEach(p => { if (p.uid) userProfilesMap.set(String(p.uid), p); if (p.username) userProfilesMap.set(String(p.username), p); });
    }

    async function fetchPosts() {
      showLoadingOverlay('加载动态…');
      await loadUserProfilesMap();
      const { data: posts } = await _supabase.from('posts').select('*');
      const { data: comments } = await _supabase.from('comments').select('*').order('id', {ascending:true});
      allPostsData = (posts || []).sort((a,b) => {
        const pa = a.is_pinned===true||a.is_pinned==='true'||a.is_pinned===1 ? 1 : 0;
        const pb = b.is_pinned===true||b.is_pinned==='true'||b.is_pinned===1 ? 1 : 0;
        if (pa!==pb) return pb-pa; return b.id-a.id;
      });
      allCommentsData = comments || [];
      hideLoadingOverlay();
      renderPostList(allPostsData, allCommentsData, document.getElementById('postsContainer'));
    }

    async function togglePinPost(postId, currentPinned) {
      if (!currentUser.isAdmin) return;
      const { error } = await _supabase.from('posts').update({ is_pinned: !currentPinned }).eq('id', postId);
      if (error) showIosAlert("错误","更新置顶失败: "+error.message,false); else fetchPosts();
    }

    async function fetchMyPosts() {
      await loadUserProfilesMap();
      const myPosts = allPostsData.filter(p => String(p.user_uid) === String(currentUser.uid));
      renderPostList(myPosts, allCommentsData, document.getElementById('myPostsContainer'));
    }

    function renderPostList(posts, comments, container) {
      if (!posts || posts.length === 0) { container.innerHTML = '<div style="text-align:center; padding:30px; color:#8e8e93; font-size:12px;">暂无动态内容</div>'; return; }
      container.innerHTML = posts.map(post => {
        const postComments = comments ? comments.filter(c => c.post_id === post.id) : [];
        const realProfile = userProfilesMap.get(String(post.user_uid)) || userProfilesMap.get(String(post.author)) || {};
        const displayUid = post.user_uid || realProfile.uid || '';
        const displayAvatar = realProfile.avatar || DEFAULT_AVATAR;
        const displayAuthor = realProfile.username || post.author || '未知用户';
        const isDev = realProfile.is_admin === true || realProfile.is_admin === 'true';
        const isMyPost = String(displayUid) === String(currentUser.uid) || post.author === currentUser.name;
        const isLiked = !!myLikedPostsMap[post.id];
        const isPinned = post.is_pinned===true||post.is_pinned==='true'||post.is_pinned===1;

        return `
          <div class="post-card ${isPinned?'pinned':''}">
            <div class="post-header">
              <div class="author-info" onclick="openUserProfileModal('${displayUid}','${escapeHtml(displayAuthor)}')">
                <img class="user-avatar-img" src="${displayAvatar}" onerror="handleAvatarError(this)">
                <div>
                  <div class="post-author-name">
                    ${isPinned?`<span class="pin-badge"><svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-pin"></use></svg> 置顶</span>`:''}
                    ${escapeHtml(displayAuthor)}
                    ${isDev?`<span class="dev-badge">开发者管理员</span>`:''}
                  </div>
                  <div class="post-time">${formatBeijingTime(post.created_at)}</div>
                </div>
              </div>
              <div class="mini-action-group">
                ${currentUser.isAdmin?`<button class="mini-btn" title="${isPinned?'取消置顶':'置顶'}" onclick="playIosClickSound();togglePinPost(${post.id},${isPinned});"><svg class="icon-svg" style="${isPinned?'color:#007aff;':''}" viewBox="0 0 24 24"><use href="#svg-pin"></use></svg></button>`:''}
                ${(isMyPost||currentUser.isAdmin)?`<button class="mini-btn" onclick="playIosClickSound();confirmDeletePost(${post.id});"><svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-trash"></use></svg></button>`:''}
              </div>
            </div>
            <div class="post-content">${escapeHtml(post.content)}</div>
            ${post.image_url?`<img class="post-image" src="${escapeHtml(post.image_url)}">`:''}
            <div class="post-footer">
              <div class="action-group">
                <button class="action-btn ${isLiked?'liked':''}" onclick="playIosClickSound();likePost(${post.id},${post.likes||0});">
                  <svg class="icon-svg" viewBox="0 0 24 24"><use href="#${isLiked?'svg-heart-filled':'svg-heart-outline'}"></use></svg>
                  <span>${post.likes||0}</span>
                </button>
              </div>
            </div>
            <div class="comments-section">
              ${postComments.map(c => {
                const cp = userProfilesMap.get(String(c.user_uid)) || {};
                const cn = cp.username || c.username || '未知用户';
                return `<div class="comment-item">
                  <div class="comment-left">
                    <span class="comment-author" onclick="openUserProfileModal('${c.user_uid||''}','${escapeHtml(cn)}')">${escapeHtml(cn)}</span>:
                    <span onclick="replyCommentUser(${post.id},'${escapeHtml(cn)}')">${escapeHtml(c.content)}</span>
                    <span class="comment-time">${formatBeijingTime(c.created_at)}</span>
                  </div>
                  ${(c.username===currentUser.name||currentUser.isAdmin)?`<button class="mini-btn" onclick="playIosClickSound();confirmDeleteComment(${c.id});">✕</button>`:''}
                </div>`;
              }).join('')}
              <div class="comment-input-group">
                <input type="text" id="commentInput_${post.id}" class="comment-input" placeholder="评论或回复...">
                <button class="comment-btn" onclick="playIosClickSound();addComment(${post.id});">发送</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function likePost(id, currentLikes) {
      if (myLikedPostsMap[id]) return;
      myLikedPostsMap[id] = true;
      saveUserDataToLocal();
      await _supabase.from('posts').update({ likes: (currentLikes||0)+1 }).eq('id', id);
      fetchPosts();
    }

    function confirmDeletePost(id) { showIosAlert('确认删除？','删除后无法恢复。',false, async()=>{ await _supabase.from('posts').delete().eq('id',id); fetchPosts(); }); }
    function confirmDeleteComment(id) { showIosAlert('确认删除？','删除后无法恢复。',false, async()=>{ await _supabase.from('comments').delete().eq('id',id); fetchPosts(); }); }

    async function addComment(postId) {
      const input = document.getElementById(`commentInput_${postId}`);
      const content = input.value.trim();
      if (!content) return;
      const { error } = await _supabase.from('comments').insert([{ post_id:postId, username:currentUser.name, user_uid:String(currentUser.uid), content }]);
      if (error) { showIosAlert("发送失败",error.message,false); return; }
      input.value = ''; await fetchPosts();
    }

    function replyCommentUser(postId, targetName) {
      playIosClickSound();
      const input = document.getElementById(`commentInput_${postId}`);
      if (input) { input.value = `@${targetName} `; input.focus(); }
    }

    /* ============================================================
       🖼️ 头像 & 发帖 & 编辑资料
       ============================================================ */
    function openAvatarChoiceModal() { document.getElementById('avatarChoiceModal').style.display = 'flex'; }
    function closeAvatarChoiceModal() { document.getElementById('avatarChoiceModal').style.display = 'none'; selectedAvatarBase64 = null; }

    function handleAvatarFileSelect(e) {
      const file = e.target.files[0];
      if (file) { const r = new FileReader(); r.onload = ev => selectedAvatarBase64 = ev.target.result; r.readAsDataURL(file); }
    }

    function applyNewAvatar() {
      const qq = document.getElementById('quickQqInput').value.trim();
      if (selectedAvatarBase64) currentUser.avatar = selectedAvatarBase64;
      else if (qq.length >= 5) currentUser.avatar = `https://q1.qlogo.cn/g?b=qq&nk=${qq}&s=640`;
      else { showIosAlert("提示","请选取图片或输入有效 QQ 号！",false); return; }
      saveUserDataToLocal(); syncUserProfileToDb(); updateProfileUI(); closeAvatarChoiceModal(); fetchPosts();
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) { const r = new FileReader(); r.onload = ev => selectedBase64Image = ev.target.result; r.readAsDataURL(file); }
    }

    function openPublishModal() {
      document.getElementById('pinOptionLabel').style.display = currentUser.isAdmin ? 'flex' : 'none';
      document.getElementById('publishModal').style.display = 'flex';
    }
    function closePublishModal() { document.getElementById('publishModal').style.display = 'none'; }

    async function submitPost() {
      const content = document.getElementById('contentInput').value.trim();
      if (!content && !selectedBase64Image) { showIosAlert("提示","内容不能为空！",false); return; }
      const shouldPin = currentUser.isAdmin && document.getElementById('pinPostCheckbox')?.checked;
      showLoadingOverlay('发布中…');
      await _supabase.from('posts').insert([{ author:currentUser.name, user_uid:String(currentUser.uid), content, likes:0, is_pinned:!!shouldPin, image_url:selectedBase64Image }]);
      hideLoadingOverlay();
      document.getElementById('contentInput').value = '';
      if (document.getElementById('pinPostCheckbox')) document.getElementById('pinPostCheckbox').checked = false;
      selectedBase64Image = null; closePublishModal(); fetchPosts();
    }

    function onSearchInput() {
      const kw = document.getElementById('searchInput').value.trim().toLowerCase();
      const c = document.getElementById('postsContainer');
      if (!kw) { renderPostList(allPostsData, allCommentsData, c); return; }
      const filtered = allPostsData.filter(p => (p.content&&p.content.toLowerCase().includes(kw)) || (p.author&&p.author.toLowerCase().includes(kw)));
      renderPostList(filtered, allCommentsData, c);
    }

    function openEditProfileModal() {
      // 只操作编辑资料弹窗里真实存在的输入框
      document.getElementById('editNameInput').value = currentUser.name || '';
      document.getElementById('editBioInput').value = currentUser.bio || '';
      document.getElementById('editProfileModal').style.display = 'flex';
    }
    function closeEditProfileModal() { document.getElementById('editProfileModal').style.display = 'none'; }

    async function saveProfile() {
      const name = document.getElementById('editNameInput').value.trim();
      const bio = document.getElementById('editBioInput').value.trim();

      // 基本信息更新
      if (name) currentUser.name = name;
      if (bio) currentUser.bio = bio;

      saveUserDataToLocal(); syncUserProfileToDb(); updateProfileUI(); closeEditProfileModal(); fetchPosts();
    }

    /* ============================================================
       🔑 独立修改密码界面
       ============================================================ */
    function openChangePassword() {
      // 清空输入框
      document.getElementById('changePwdCurrent').value = '';
      document.getElementById('changePwdNew').value = '';
      document.getElementById('changePwdConfirm').value = '';
      document.getElementById('changePwdOverlay').classList.add('active');
    }

    function closeChangePassword() {
      document.getElementById('changePwdOverlay').classList.remove('active');
    }

    async function submitChangePassword() {
      const currentPwd = document.getElementById('changePwdCurrent').value;
      const newPwd = document.getElementById('changePwdNew').value;
      const confirmPwd = document.getElementById('changePwdConfirm').value;

      // 三项都不能为空
      if (!currentPwd || !newPwd || !confirmPwd) {
        showIosAlert("密码修改失败", "请完整填写当前密码、新密码和确认密码！", false);
        return;
      }

      // 验证当前密码
      showLoadingOverlay('正在验证…');
      const currentHash = await hashPassword(String(currentUser.uid), currentPwd);
      const { data: userData, error: fetchError } = await _supabase.rpc('get_user_by_uid', { uid_input: String(currentUser.uid) });
      hideLoadingOverlay();

      if (fetchError || !userData || userData.length === 0) {
        showIosAlert("密码修改失败", "无法验证当前密码，请稍后重试。", false);
        return;
      }
      const dbHash = userData[0].password_hash;

      // 老账号（password_hash 为空/null）
      if (!dbHash) {
        showIosAlert("无法修改密码", "你的账号是密码系统上线前创建的，请先联系管理员初始化密码，或使用注册功能新建账号。", false);
        return;
      }
      if (dbHash !== currentHash) {
        showIosAlert("密码修改失败", "当前密码输入错误！", false);
        return;
      }

      // 两次新密码一致
      if (newPwd !== confirmPwd) {
        showIosAlert("密码修改失败", "两次输入的新密码不一致！", false);
        return;
      }

      // 新密码强度校验
      const pwdErr = validatePasswordStrength(newPwd);
      if (pwdErr) {
        showIosAlert("密码不符合要求", pwdErr, false);
        return;
      }

      // 新密码不能与当前密码相同
      if (newPwd === currentPwd) {
        showIosAlert("密码修改失败", "新密码不能与当前密码相同！", false);
        return;
      }

      // 写入新密码
      showLoadingOverlay('正在更新密码…');
      const newHash = await hashPassword(String(currentUser.uid), newPwd);
      const { error: updateErr } = await _supabase.from('profiles').update({ password_hash: newHash }).eq('uid', String(currentUser.uid));
      hideLoadingOverlay();

      if (updateErr) {
        showIosAlert("密码修改失败", updateErr.message || "更新密码时出错", false);
        return;
      }

      closeChangePassword();
      showIosAlert("密码修改成功", "你的密码已更新，下次登录请使用新密码。", false);
    }

    /* ============================================================
       🛠️ 工具函数
       ============================================================ */
    function formatBeijingTime(utc) {
      if (!utc) return '';
      const d = new Date(utc);
      return isNaN(d.getTime()) ? '' : d.toLocaleString('zh-CN', {timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
    }
    function escapeHtml(str) {
      return str ? str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;') : '';
    }

    /* ============================================================
       🚀 页面初始化
       ============================================================ */
    window.onload = function() {
      // 开屏动画
      setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        if (splash) { splash.classList.add('fade-out'); setTimeout(() => splash.style.display = 'none', 600); }
      }, 1200);

      if (!currentUser.uid) {
        document.getElementById('authOverlay').style.display = 'flex';
      } else {
        updateProfileUI();
        fetchPosts();
        setupGlobalMessageListener();
        renderChatList();
      }
      updateNavBadge();
    };
  </script>
</body>
</html>

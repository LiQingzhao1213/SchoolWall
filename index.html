          }
        });
      }

      return { requestDevAuth };
    })();

    /* ============================================================
       📝 论坛模块
       ============================================================ */
    const Forum = (() => {
      let allPosts = [];
      let allComments = [];
      let profileMap = new Map();
      let likedPosts = SecureStore.get('liked_posts') || {};

      async function loadProfiles() {
        const { data } = await _supabase.from('profiles').select('*');
        profileMap.clear();
        if (data) data.forEach(p => {
          if (p.uid) profileMap.set(String(p.uid), p);
          if (p.username) profileMap.set(String(p.username), p);
          if (p.id) profileMap.set(p.id, p);
        });
      }

      async function fetchPosts() {
        UI.showLoading('加载动态…');
        await loadProfiles();
        const { data: posts } = await _supabase.from('posts').select('*').order('id', { ascending: false });
        const { data: comments } = await _supabase.from('comments').select('*').order('id', { ascending: true });

        // 置顶排序在服务端完成不了复杂逻辑，客户端轻排
        allPosts = (posts || []).sort((a,b) => {
          const pa = a.is_pinned===true||a.is_pinned==='true'||a.is_pinned===1 ? 1 : 0;
          const pb = b.is_pinned===true||b.is_pinned==='true'||b.is_pinned===1 ? 1 : 0;
          if (pa!==pb) return pb-pa; return b.id-a.id;
        });
        allComments = comments || [];
        UI.hideLoading();
        renderPostList(allPosts, allComments, document.getElementById('postsContainer'));
      }

      async function fetchMyPosts() {
        await loadProfiles();
        const myPosts = allPosts.filter(p => p.user_id === Session.getUserId());
        renderPostList(myPosts, allComments, document.getElementById('myPostsContainer'));
      }

      function renderPostList(posts, comments, container) {
        if (!posts || posts.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:30px; color:#8e8e93; font-size:12px;">暂无动态内容</div>';
          return;
        }
        container.innerHTML = posts.map(post => {
          const postComments = comments ? comments.filter(c => c.post_id === post.id) : [];
          const authorId = post.user_id;
          const profile = profileMap.get(authorId) || {};
          const displayUid = profile.uid || '';
          const displayAvatar = profile.avatar || DEFAULT_AVATAR;
          const displayAuthor = profile.username || '未知用户';
          const isDev = profile.is_admin === true || profile.is_admin === 'true';
          const isPinned = post.is_pinned===true||post.is_pinned==='true'||post.is_pinned===1;

          // 🔒 权限判断：从服务端获取的 Session 状态，不信任客户端
          const canDelete = Session.isAdmin() || authorId === Session.getUserId();
          const canPin = Session.isAdmin();
          const isLiked = !!likedPosts[post.id];

          return `
            <div class="post-card ${isPinned?'pinned':''}">
              <div class="post-header">
                <div class="author-info" onclick="Forum.showUserProfile('${authorId}')">
                  <img class="user-avatar-img" src="${displayAvatar}" onerror="UI.handleAvatarError(this)">
                  <div>
                    <div class="post-author-name">
                      ${isPinned?`<span class="pin-badge"><svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-pin"></use></svg> 置顶</span>`:''}
                      ${escapeHtml(displayAuthor)}
                      ${isDev?`<span class="dev-badge">开发者管理员</span>`:''}
                    </div>
                    <div class="post-time">${formatTime(post.created_at)}</div>
                  </div>
                </div>
                <div class="mini-action-group">
                  ${canPin?`<button class="mini-btn" title="${isPinned?'取消置顶':'置顶'}" onclick="Forum.togglePin(${post.id},${isPinned});"><svg class="icon-svg" style="${isPinned?'color:#007aff;':''}" viewBox="0 0 24 24"><use href="#svg-pin"></use></svg></button>`:''}
                  ${canDelete?`<button class="mini-btn" onclick="Forum.deletePost(${post.id});"><svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-trash"></use></svg></button>`:''}
                </div>
              </div>
              <div class="post-content">${escapeHtml(post.content)}</div>
              ${post.image_url?`<img class="post-image" src="${escapeHtml(post.image_url)}" onerror="this.style.display='none'">`:''}
              <div class="post-footer">
                <div class="action-group">
                  <button class="action-btn ${isLiked?'liked':''}" onclick="Forum.likePost(${post.id},${post.likes||0});">
                    <svg class="icon-svg" viewBox="0 0 24 24"><use href="#${isLiked?'svg-heart-filled':'svg-heart-outline'}"></use></svg>
                    <span>${post.likes||0}</span>
                  </button>
                </div>
              </div>
              <div class="comments-section">
                ${postComments.map(c => {
                  const cp = profileMap.get(c.user_id) || {};
                  const cn = cp.username || '未知用户';
                  const canDelComment = Session.isAdmin() || c.user_id === Session.getUserId();
                  return `<div class="comment-item">
                    <div class="comment-left">
                      <span class="comment-author" onclick="Forum.showUserProfile('${c.user_id||''}')">${escapeHtml(cn)}</span>:
                      <span onclick="Forum.replyComment(${post.id},'${escapeHtml(cn)}')">${escapeHtml(c.content)}</span>
                      <span class="comment-time">${formatTime(c.created_at)}</span>
                    </div>
                    ${canDelComment?`<button class="mini-btn" onclick="Forum.deleteComment(${c.id});">✕</button>`:''}
                  </div>`;
                }).join('')}
                <div class="comment-input-group">
                  <input type="text" id="commentInput_${post.id}" class="comment-input" placeholder="评论或回复...">
                  <button class="comment-btn" onclick="Forum.addComment(${post.id});">发送</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      async function togglePin(postId, currentPinned) {
        // 🔒 服务端 RLS 会再次校验权限
        const { error } = await _supabase.from('posts').update({ is_pinned: !currentPinned }).eq('id', postId);
        if (error) UI.showIosAlert("错误","操作失败: "+error.message); else fetchPosts();
      }

      async function deletePost(id) {
        UI.showIosAlert('确认删除？','删除后无法恢复。', false, async()=>{
          // 🔒 服务端 RLS 确保只有作者或管理员能删除
          const { error } = await _supabase.from('posts').delete().eq('id', id);
          if (error) UI.showIosAlert("失败", error.message); else fetchPosts();
        });
      }

      async function deleteComment(id) {
        UI.showIosAlert('确认删除？','删除后无法恢复。', false, async()=>{
          const { error } = await _supabase.from('comments').delete().eq('id', id);
          if (error) UI.showIosAlert("失败", error.message); else fetchPosts();
        });
      }

      async function likePost(id, currentLikes) {
        if (likedPosts[id]) return; // 防重复点赞
        likedPosts[id] = true;
        SecureStore.set('liked_posts', likedPosts);
        // 🔒 使用 RPC 防止竞态条件（服务端原子递增）
        const { error } = await _supabase.rpc('increment_post_likes', { post_id_input: id });
        if (error) {
          // 降级方案
          await _supabase.from('posts').update({ likes: (currentLikes||0)+1 }).eq('id', id);
        }
        fetchPosts();
      }

      async function addComment(postId) {
        const input = document.getElementById(`commentInput_${postId}`);
        const content = input.value.trim();
        if (!content) return;
        // 🔒 服务端 RLS 确保 user_id 必须是当前用户
        const { error } = await _supabase.from('comments').insert([{
          post_id: postId,
          user_id: Session.getUserId(),
          content: content
        }]);
        if (error) { UI.showIosAlert("发送失败",error.message); return; }
        input.value = ''; await fetchPosts();
      }

      function replyComment(postId, targetName) {
        const input = document.getElementById(`commentInput_${postId}`);
        if (input) { input.value = `@${targetName} `; input.focus(); }
      }

      function onSearchInput() {
        const kw = document.getElementById('searchInput').value.trim().toLowerCase();
        const c = document.getElementById('postsContainer');
        if (!kw) { renderPostList(allPosts, allComments, c); return; }
        const filtered = allPosts.filter(p =>
          (p.content && p.content.toLowerCase().includes(kw)) ||
          (p.author && p.author.toLowerCase().includes(kw))
        );
        renderPostList(filtered, allComments, c);
      }

      function openPublishModal() {
        document.getElementById('pinOptionLabel').style.display = Session.isAdmin() ? 'flex' : 'none';
        document.getElementById('publishModal').style.display = 'flex';
      }

      let selectedImage = null;
      function handleFileSelect(e) {
        const file = e.target.files[0];
        if (file) {
          const r = new FileReader();
          r.onload = ev => { selectedImage = ev.target.result; };
          r.readAsDataURL(file);
        }
      }

      async function submitPost() {
        const content = document.getElementById('contentInput').value.trim();
        if (!content && !selectedImage) { UI.showIosAlert("提示","内容不能为空！"); return; }

        const shouldPin = Session.isAdmin() && document.getElementById('pinPostCheckbox')?.checked;

        UI.showLoading('发布中…');
        // 🔒 服务端 RLS 确保 user_id 必须是当前用户，无法伪造
        const { error } = await _supabase.from('posts').insert([{
          user_id: Session.getUserId(),
          content: content,
          likes: 0,
          is_pinned: !!shouldPin,
          image_url: selectedImage
        }]);
        UI.hideLoading();

        if (error) { UI.showIosAlert("发布失败", error.message); return; }
        document.getElementById('contentInput').value = '';
        if (document.getElementById('pinPostCheckbox')) document.getElementById('pinPostCheckbox').checked = false;
        selectedImage = null;
        UI.closeModal('publishModal');
        fetchPosts();
      }

      function showUserProfile(userId) {
        const profile = profileMap.get(userId) || {};
        document.getElementById('modalUserAvatar').src = profile.avatar || DEFAULT_AVATAR;
        document.getElementById('modalUserName').innerText = profile.username || '未知用户';
        document.getElementById('modalUserUid').innerText = profile.uid || '------';
        document.getElementById('modalUserBio').innerText = profile.bio || '暂无简介...';
        const chatBtn = document.getElementById('modalStartChatBtn');
        if (userId === Session.getUserId()) {
          chatBtn.style.display = 'none';
        } else {
          chatBtn.style.display = 'inline-flex';
          chatBtn.onclick = function() {
            UI.closeModal('userProfileModal');
            Chat.openDialog(userId);
          };
        }
        document.getElementById('userProfileModal').style.display = 'flex';
      }

      return {
        fetchPosts, fetchMyPosts, renderPostList, togglePin, deletePost, deleteComment,
        likePost, addComment, replyComment, onSearchInput, openPublishModal,
        handleFileSelect, submitPost, showUserProfile
      };
    })();

    /* ============================================================
       💬 私信模块
       ============================================================ */
    const Chat = (() => {
      let activeTargetId = null;
      let pendingReplyIdx = null;
      let localChats = SecureStore.get('local_chats') || {};
      let profileMap = new Map();
      let realtimeChannel = null;

      async function init() {
        await loadProfiles();
        renderList();
        setupRealtime();
        // 监听认证状态变化
        _supabase.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_OUT') {
            localChats = {};
            SecureStore.set('local_chats', {});
          }
        });
      }

      async function loadProfiles() {
        const { data } = await _supabase.from('profiles').select('*');
        profileMap.clear();
        if (data) data.forEach(p => {
          if (p.uid) profileMap.set(String(p.uid), p);
          if (p.id) profileMap.set(p.id, p);
        });
      }

      function renderSkeleton() {
        const c = document.getElementById('chatFriendsContainer');
        c.innerHTML = Array(3).fill(0).map(() =>
          `<div class="ios-skeleton-card"><div class="skeleton-avatar shimmer"></div><div class="skeleton-info"><div class="skeleton-line short shimmer"></div><div class="skeleton-line long shimmer"></div></div></div>`
        ).join('');
      }

      async function renderList() {
        renderSkeleton();
        await loadProfiles();
        const container = document.getElementById('chatFriendsContainer');
        const uids = Object.keys(localChats);

        if (uids.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:30px; color:#8e8e93; font-size:12px;">暂无私信记录，输入 UID 查找吧</div>';
          updateNavBadge(0);
          return;
        }

        let totalUnread = 0;
        container.innerHTML = '';
        uids.forEach(uid => {
          const profile = profileMap.get(uid) || profileMap.get(String(uid)) || {};
          const msgs = localChats[uid] || [];
          const unread = msgs.filter(m => m.sender === 'other' && !m.isRead).length;
          totalUnread += unread;
          const lastMsg = msgs.length > 0 ? msgs[msgs.length-1].text : '暂无聊天内容...';
          const lastTime = msgs.length > 0 ? msgs[msgs.length-1].time : '';
          const card = document.createElement('div');
          card.className = 'chat-item-card' + (unread > 0 ? ' has-unread' : '');
          card.innerHTML = `
            <div class="chat-avatar-wrapper">
              <img class="chat-item-avatar" src="${profile.avatar || DEFAULT_AVATAR}" onerror="UI.handleAvatarError(this)">
              ${unread > 0 ? `<div class="unread-badge">${unread>99?'99+':unread}</div>` : ''}
            </div>
            <div class="chat-item-info">
              <div class="chat-item-name ${unread>0?'unread-name':''}">${escapeHtml(profile.username || '用户_'+uid)}</div>
              <div class="chat-item-lastmsg ${unread>0?'unread-msg':''}">${escapeHtml(lastMsg)}</div>
            </div>
            <div class="chat-item-time ${unread>0?'unread-time':''}">${lastTime ? formatTime(lastTime) : ''}</div>
          `;
          // 长按菜单
          bindLongPress(card, uid);
          card.onclick = () => openDialog(uid);
          container.appendChild(card);
        });
        updateNavBadge(totalUnread);
      }

      function bindLongPress(el, uid) {
        let timer = null, triggered = false;
        const start = () => { triggered = false; timer = setTimeout(() => { triggered = true; UI.playIosHapticSound(); showChatMenu(uid); }, 400); };
        const cancel = () => clearTimeout(timer);
        el.addEventListener('touchstart', start, {passive:true}); el.addEventListener('touchend', cancel); el.addEventListener('touchmove', cancel);
        el.addEventListener('mousedown', start); el.addEventListener('mouseup', cancel); el.addEventListener('mouseleave', cancel);
        el._clickHandler = () => { if (triggered) { triggered = false; return true; } return false; };
      }

      function showChatMenu(uid) {
        const profile = profileMap.get(uid) || {};
        const name = profile.username || '用户_' + uid;
        UI.openActionSheet([
          { label: `🧹 清空与 ${escapeHtml(name)} 的聊天记录`, danger: true, action: `Chat.clearHistory('${uid}')` },
          { label: `🗑️ 删除联系人 ${escapeHtml(name)}`, danger: true, action: `Chat.removeContact('${uid}')` }
        ]);
      }

      function clearHistory(uid) {
        UI.showIosAlert("确认清空记录？","将抹除所有聊天记录。", false, () => {
          localChats[uid] = [];
          SecureStore.set('local_chats', localChats);
          renderList();
        });
      }

      function removeContact(uid) {
        UI.showIosAlert("确认删除此联系人？","将从列表中移除并清除记录。", false, () => {
          delete localChats[uid];
          SecureStore.set('local_chats', localChats);
          renderList();
        });
      }

      async function onSearchClicked() {
        const uidInput = document.getElementById('chatSearchUidInput').value.trim();
        if (!uidInput) { UI.showIosAlert("提示","请输入需要查找的 UID！"); return; }
        if (!/^\d{6}$/.test(uidInput)) { UI.showIosAlert("格式错误","UID 必须为 6 位数字！"); return; }
        if (uidInput === String(Session.getUid())) { UI.showIosAlert("提示","不能给自己发送私信！"); return; }

        UI.showLoading('正在查找用户…');
        await loadProfiles();
        const target = profileMap.get(uidInput);
        UI.hideLoading();

        if (!target) { UI.showIosAlert("查找失败","未找到该 UID 的用户！"); return; }
        if (!localChats[uidInput]) { localChats[uidInput] = []; SecureStore.set('local_chats', localChats); }
        document.getElementById('chatSearchUidInput').value = '';
        openDialog(target.id || uidInput);
      }

      function openDialog(targetId) {
        activeTargetId = targetId;
        const profile = profileMap.get(targetId) || {};
        document.getElementById('targetChatName').innerText = profile.username || '用户_' + targetId;
        document.getElementById('targetChatAvatar').src = profile.avatar || DEFAULT_AVATAR;
        document.body.classList.add('chat-mode');
        document.getElementById('chatListView').style.display = 'none';
        document.getElementById('chatDialogView').style.display = 'block';
        pendingReplyIdx = null;
        document.getElementById('replyPreviewBar').classList.remove('active');
        markAsRead(targetId);
        renderMessages();
      }

      function backToList() {
        activeTargetId = null;
        document.body.classList.remove('chat-mode');
        document.getElementById('chatDialogView').style.display = 'none';
        document.getElementById('chatListView').style.display = 'block';
        renderList();
      }

      function renderMessages() {
        if (!activeTargetId) return;
        const box = document.getElementById('chatMessagesBox');
        const msgs = localChats[activeTargetId] || [];
        const meProfile = { name: Session.getName(), avatar: Session.getAvatar() };
        const otherProfile = profileMap.get(activeTargetId) || {};
        const otherName = otherProfile.username || ('用户_' + activeTargetId);
        const otherAvatar = otherProfile.avatar || DEFAULT_AVATAR;

        if (msgs.length === 0) {
          box.innerHTML = '<div style="text-align:center; color:#8e8e93; font-size:11px; margin-top:20px;">打个招呼吧 ~</div>';
          return;
        }

        box.innerHTML = msgs.map((m, idx) => {
          const isMe = m.sender === 'me';
          const timeStr = m.time ? new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
          const senderName = isMe ? meProfile.name : otherName;
          const senderAvatar = isMe ? meProfile.avatar : otherAvatar;
          let statusHtml = '';
          if (isMe) {
            statusHtml = m.isRead
              ? `<span class="tg-read-status read"><svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-check-double"></use></svg></span>`
              : `<span class="tg-read-status sent"><svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-check-single"></use></svg></span>`;
          }
          let replyHtml = '';
          if (m.replyToIdx != null && msgs[m.replyToIdx]) {
            const rm = msgs[m.replyToIdx];
            const rn = rm.sender === 'me' ? meProfile.name : otherName;
            replyHtml = `<div class="msg-reply-quote" onclick="Chat.scrollToMsg(${m.replyToIdx})">
              <span class="msg-reply-author">← ${escapeHtml(rn)}</span>
              <span class="msg-reply-text">${escapeHtml(rm.text||'')}</span>
            </div>`;
          }
          return `
            <div class="msg-row ${isMe?'me':'other'}" id="msg-row-${idx}">
              <img class="msg-avatar" src="${senderAvatar}" onerror="UI.handleAvatarError(this)">
              <div class="msg-stack">
                <div class="msg-sender-name">${escapeHtml(senderName)}</div>
                <div class="msg-bubble ${isMe?'me':'other'}"
                     oncontextmenu="event.preventDefault();UI.playIosHapticSound();Chat.showMsgMenu(${idx});"
                     ontouchstart="Chat._touchStart(${idx})" ontouchend="Chat._touchEnd()">
                  ${replyHtml}
                  <span>${escapeHtml(m.text)}</span>
                  <div class="msg-meta-bar"><span>${timeStr}</span>${statusHtml}</div>
                </div>
              </div>
            </div>
          `;
        }).join('');
        box.scrollTop = box.scrollHeight;
      }

      var _touchTimer = null;
      function _touchStart(idx) {
        _touchTimer = setTimeout(() => { UI.playIosHapticSound(); showMsgMenu(idx); _touchTimer = null; }, 450);
      }
      function _touchEnd() { if(_touchTimer) { clearTimeout(_touchTimer); _touchTimer = null; } }

      function showMsgMenu(idx) {
        const msgs = localChats[activeTargetId] || [];
        const msg = msgs[idx]; if (!msg) return;
        const options = [];
        options.push({ label: `↩️ 回复该消息`, action: `Chat.beginReply(${idx})` });
        if (msg.sender === 'me') options.push({ label: `✏️ 撤回并重新编辑`, action: `Chat.recallMsg(${idx})` });
        options.push({ label: `🗑️ 删除该消息`, danger: true, action: `Chat.deleteMsg(${idx})` });
        UI.openActionSheet(options);
      }

      function beginReply(idx) {
        const msgs = localChats[activeTargetId] || [];
        const m = msgs[idx]; if(!m) return;
        const isMe = m.sender === 'me';
        const profile = isMe ? { username: Session.getName(), avatar: Session.getAvatar() } : (profileMap.get(activeTargetId) || {});
        document.getElementById('replyPrevName').textContent = '回复 ' + (profile.username || '用户');
        document.getElementById('replyPrevText').textContent = m.text || '';
        document.getElementById('replyPrevAvatar').src = profile.avatar || DEFAULT_AVATAR;
        document.getElementById('replyPreviewBar').classList.add('active');
        pendingReplyIdx = idx;
        setTimeout(() => { const inp = document.getElementById('chatMsgInput'); if(inp) inp.focus(); }, 100);
      }

      function cancelReply() {
        pendingReplyIdx = null;
        document.getElementById('replyPreviewBar').classList.remove('active');
      }

      function recallMsg(idx) {
        const msgs = localChats[activeTargetId];
        if (!msgs || !msgs[idx]) return;
        const recalled = msgs[idx].text;
        msgs.splice(idx, 1);
        SecureStore.set('local_chats', localChats);
        document.getElementById('chatMsgInput').value = recalled;
        renderMessages();
      }

      function deleteMsg(idx) {
        UI.showIosAlert("确认删除消息？","将抹除该条消息记录。", false, () => {
          const msgs = localChats[activeTargetId];
          if (msgs) { msgs.splice(idx, 1); SecureStore.set('local_chats', localChats); renderMessages(); }
        });
      }

      function scrollToMsg(idx) {
        const el = document.getElementById('msg-row-'+idx);
        if(!el) return;
        el.scrollIntoView({behavior:'smooth', block:'center'});
        const bubble = el.querySelector('.msg-bubble');
        if(bubble){ bubble.classList.remove('highlight'); void bubble.offsetWidth; bubble.classList.add('highlight'); }
      }

      function sendMessage() {
        const input = document.getElementById('chatMsgInput');
        const text = input.value.trim();
        if (!text || !activeTargetId) return;

        if (!localChats[activeTargetId]) localChats[activeTargetId] = [];
        localChats[activeTargetId].push({
          sender: 'me', text, time: new Date().toISOString(), isRead: false,
          replyToIdx: pendingReplyIdx != null ? pendingReplyIdx : null
        });
        SecureStore.set('local_chats', localChats);
        input.value = '';
        pendingReplyIdx = null;
        document.getElementById('replyPreviewBar').classList.remove('active');
        renderMessages();

        // 🔒 服务端 RLS 确保 sender_id 必须是当前用户
        _supabase.from('messages').insert([{
          sender_id: Session.getUserId(),
          receiver_id: activeTargetId,
          content: text,
          is_read: false
        }]).then(() => renderList());
      }

      function onPlusClicked() {
        UI.openActionSheet([
          { label: `📷 发送图片`, action: `UI.showToast('图片功能开发中',2000)` },
          { label: `📎 发送文件`, action: `UI.showToast('文件功能开发中',2000)` }
        ]);
      }

      function markAsRead(targetId) {
        const msgs = localChats[targetId];
        if (!msgs || msgs.length === 0) return;
        let changed = false;
        msgs.forEach(m => { if (m.sender === 'other' && !m.isRead) { m.isRead = true; changed = true; } });
        if (changed) {
          SecureStore.set('local_chats', localChats);
          _supabase.from('messages').update({ is_read: true })
            .eq('sender_id', targetId)
            .eq('receiver_id', Session.getUserId())
            .eq('is_read', false)
            .then(() => { renderMessages(); renderList(); });
        }
      }

      function setupRealtime() {
        if (realtimeChannel) _supabase.removeChannel(realtimeChannel);
        const userId = Session.getUserId();
        if (!userId) return;

        realtimeChannel = _supabase
          .channel('global-msg-' + userId)
          .on('postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'messages', filter: `receiver_id=eq.${userId}` },
            (payload) => handleNewMessage(payload.new)
          )
          .on('postgres_changes',
            { event: 'UPDATE', schema: 'public', table: 'messages', filter: `sender_id=eq.${userId}` },
            (payload) => {
              const updated = payload.new;
              const targetId = updated.receiver_id;
              const msgs = localChats[targetId];
              if (msgs) {
                const msg = msgs.find(m => m.text === updated.content && m.sender === 'me' && !m.isRead);
                if (msg) { msg.isRead = true; SecureStore.set('local_chats', localChats); }
              }
              if (activeTargetId === targetId) renderMessages();
              renderList();
            }
          )
          .subscribe();
      }

      function handleNewMessage(msg) {
        const fromId = msg.sender_id;
        if (!localChats[fromId]) localChats[fromId] = [];
        localChats[fromId].push({
          sender: 'other', text: msg.content, time: msg.created_at || new Date().toISOString(), isRead: false
        });
        SecureStore.set('local_chats', localChats);

        if (activeTargetId === fromId) {
          markAsRead(fromId);
        } else {
          const profile = profileMap.get(fromId) || {};
          UI.showToast(`📨 来自 ${profile.username || fromId} 的新消息`, 3000, () => {
            UI.switchTab('chat', 1); openDialog(fromId);
          });
        }
        renderList();
      }

      // 轮询兜底
      setInterval(() => { if (Session.getUserId()) renderList(); }, 15000);

      function updateNavBadge(totalUnread) {
        const badge = document.getElementById('chatNavBadge');
        if (!badge) return;
        if (totalUnread > 0) {
          badge.textContent = totalUnread > 99 ? '99+' : String(totalUnread);
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }

      return {
        init, renderList, onSearchClicked, openDialog, backToList,
        sendMessage, onPlusClicked, cancelReply, beginReply, recallMsg,
        deleteMsg, scrollToMsg, showMsgMenu, _touchStart, _touchEnd,
        clearHistory, removeContact, updateNavBadge
      };
    })();

    /* ============================================================
       🛠️ 工具函数
       ============================================================ */
    function formatTime(utc) {
      if (!utc) return '';
      const d = new Date(utc);
      return isNaN(d.getTime()) ? '' : d.toLocaleString('zh-CN', {timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
    }

    function escapeHtml(str) {
      return str ? str.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;') : '';
    }

    const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23e5e5ea'/%3E%3Ccircle cx='50' cy='38' r='18' fill='%238e8e93'/%3E%3Cpath d='M20,85 C20,65 33,56 50,56 C67,56 80,65 80,85 Z' fill='%238e8e93'/%3E%3C/svg%3E";

    /* ============================================================
       🚀 页面初始化
       ============================================================ */
    window.onload = async function() {
      // 开屏动画
      setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        if (splash) { splash.classList.add('fade-out'); setTimeout(() => splash.style.display = 'none', 600); }
      }, 1200);

      // 初始化认证状态
      const user = await Session.init();

      if (!user) {
        document.getElementById('authOverlay').style.display = 'flex';
      } else {
        Profile.updateUI();
        Forum.fetchPosts();
        Chat.init();
      }
    };

    /* ============================================================
       🔒 全局暴露控制（仅暴露必要接口，隐藏敏感逻辑）
       ============================================================ */
    // 只暴露 UI 交互所需的函数到全局
    window.UI = UI;
    window.Forum = Forum;
    window.Chat = Chat;
    window.Profile = Profile;
    window.AuthUI = AuthUI;
    window.Admin = Admin;

    // 🔒 关键：冻结所有暴露的模块，防止篡改
    Object.freeze(window.UI);
    Object.freeze(window.Forum);
    Object.freeze(window.Chat);
    Object.freeze(window.Profile);
    Object.freeze(window.AuthUI);
    Object.freeze(window.Admin);

    // 🔒 隐藏 Session 模块（不暴露到全局）
    // 攻击者无法通过 window.Session 访问会话信息

    // 🔒 禁用 eval 和 Function 构造函数
    window.eval = function() { throw new Error('[Security] eval() is disabled'); };
    window.Function = function() { throw new Error('[Security] Function() constructor is disabled'); };

    console.log('%c🔒 校园社区安全模式已启用', 'color:#007aff;font-size:14px;font-weight:700;');
    console.log('%c如需调试，请联系管理员获取授权。', 'color:#8e8e93;font-size:12px;');
  </script>
</body>

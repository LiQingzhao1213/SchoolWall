      <button class="auth-submit-btn" onclick="App.UI.playClick();App.Auth.submitChangePwd();">确认修改</button>
      <button class="change-pwd-btn-secondary" onclick="App.UI.playClick();App.Auth.closeChangePwd();">取消</button>
    </div>
  </div>

  <script>
  /* ============================================================
     🔒 校园社区 — 安全加固版 v2.0
     - Supabase Auth（服务端 bcrypt 哈希）
     - 密钥通过 GitHub Secrets → GitHub Actions 注入
     - 所有权限判断走 RLS（服务端校验）
     - 防调试 / 防注入 / 防篡改 / 防 F12 注入攻击
     - 已修复：Chat._timer 冻结写入、mousedown 拼写、
       AppState 未冻结、Security 前向引用等问题
     ============================================================ */
  (function () {
    'use strict';

    /* ---------- 🔐 从 meta 标签读取密钥（由 GitHub Actions 注入） ---------- */
    var SUPABASE_URL = document.querySelector('meta[name="supabase-url"]')?.content || '';
    var SUPABASE_KEY = document.querySelector('meta[name="supabase-key"]')?.content || '';

    // 如果密钥未被注入（本地开发或构建失败），立即阻断
    if (!SUPABASE_URL || !SUPABASE_KEY ||
        SUPABASE_URL === '__SUPABASE_URL__' ||
        SUPABASE_KEY === '__SUPABASE_ANON_KEY__') {
      console.error('[Security] Supabase 配置缺失，请通过 GitHub Secrets 注入 URL 和 Anon Key');
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;padding:20px;text-align:center;"><h2 style="color:#ff3b30;">⚠️ 安全配置缺失</h2><p style="color:#8e8e93;font-size:14px;">Supabase URL 和 Anon Key 未正确注入。<br>请在 GitHub Secrets 中配置后重新部署。</p></div>';
      return;
    }

    var _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true },
      realtime: { params: { eventsPerSecond: 10 } }
    });

    var DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23e5e5ea'/%3E%3Ccircle cx='50' cy='38' r='18' fill='%238e8e93'/%3E%3Cpath d='M20,85 C20,65 33,56 50,56 C67,56 80,65 80,85 Z' fill='%238e8e93'/%3E%3C/svg%3E";

    /* ---------- 🛡️ 全局应用状态（从服务端获取，不信任本地存储） ---------- */
    var AppState = Object.freeze({
      userId: null,        // Supabase Auth UUID
      userEmail: null,
      userName: '',
      userAvatar: DEFAULT_AVATAR,
      userBio: '',
      isAdmin: false,
      loaded: false
    });

    /* ---------- 📦 本地缓存（仅用于离线体验，不可信） ---------- */
    var localChats = JSON.parse(localStorage.getItem('campus_chats') || '{}');
    var likedPosts = JSON.parse(localStorage.getItem('campus_liked') || '{}');

    /* ---------- 🔊 音效 ---------- */
    var audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playClick() {
      try {
        var ctx = getAudio(), osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.03);
        g.gain.setValueAtTime(0.15, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
        osc.connect(g); g.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.03);
      } catch(e) {}
    }
    function playHaptic() {
      try {
        var ctx = getAudio(), osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(160, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.08);
        g.gain.setValueAtTime(0.4, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(g); g.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.08);
        if (navigator.vibrate) navigator.vibrate(15);
      } catch(e) {}
    }

    /* ---------- 🍏 加载动画 ---------- */
    function showLoading(label) {
      var el = document.getElementById('iosLoadingOverlay');
      document.getElementById('loadingLabel').textContent = label || '载入中…';
      el.classList.remove('hidden');
    }
    function hideLoading() { document.getElementById('iosLoadingOverlay').classList.add('hidden'); }

    /* ---------- 🔔 Toast ---------- */
    function showToast(msg, ms, onClick) {
      var c = document.getElementById('toastContainer');
      var t = document.createElement('div');
      t.className = 'toast-notification' + (onClick ? ' clickable' : '');
      t.textContent = msg;
      t.onclick = function() { if (onClick) onClick(); hideToast(t); };
      c.appendChild(t);
      requestAnimationFrame(function() { t.classList.add('show'); });
      if (ms) setTimeout(function() { hideToast(t); }, ms);
    }
    function hideToast(t) { t.classList.remove('show'); setTimeout(function() { t.remove(); }, 300); }

    /* ---------- 🚨 Alert & ActionSheet ---------- */
    var alertCallback = null;
    function showAlert(title, desc, isInput, onConfirm) {
      playClick();
      document.getElementById('iosAlertTitle').textContent = title;
      document.getElementById('iosAlertDesc').textContent = desc || '';
      var inp = document.getElementById('iosAlertInput');
      inp.style.display = isInput ? 'block' : 'none';
      if (isInput) inp.value = '';
      alertCallback = onConfirm;
      document.getElementById('iosAlertModal').style.display = 'flex';
    }
    function closeAlert() { document.getElementById('iosAlertModal').style.display = 'none'; alertCallback = null; }
    document.getElementById('iosAlertConfirmBtn').onclick = function() {
      playClick();
      var v = document.getElementById('iosAlertInput').value;
      if (alertCallback) alertCallback(v);
      closeAlert();
    };

    function openActionSheet(options) {
      var c = document.getElementById('actionSheetOptions');
      c.innerHTML = options.map(function(o) {
        return '<button class="ios-sheet-btn ' + (o.danger ? 'danger' : '') + '" onclick="App.UI.playClick();App.UI.closeActionSheet();' + o.action + '">' + o.label + '</button>';
      }).join('');
      document.getElementById('iosActionSheet').style.display = 'flex';
    }
    function closeActionSheet() { document.getElementById('iosActionSheet').style.display = 'none'; }

    /* ---------- 🛠️ 工具函数 ---------- */
    function escapeHtml(s) {
      return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;') : '';
    }
    function formatTime(utc) {
      if (!utc) return '';
      var d = new Date(utc);
      return isNaN(d.getTime()) ? '' : d.toLocaleString('zh-CN', {timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
    }
    function handleAvatarError(img) { img.onerror = null; img.src = DEFAULT_AVATAR; }

    /* ---------- 📜 滚动隐藏导航 ---------- */
    var lastScrollY = window.scrollY;
    window.addEventListener('scroll', function() {
      var cy = window.scrollY;
      var header = document.getElementById('forumSearchBar');
      var fab = document.getElementById('mainFabBtn');
      var dock = document.getElementById('mainDockBar');
      if (cy - lastScrollY > 15 && cy > 50) {
        header && header.classList.add('scroll-hidden');
        fab && fab.classList.add('scroll-hidden');
        dock && dock.classList.add('scroll-hidden');
      } else if (lastScrollY - cy > 15 || cy <= 20) {
        header && header.classList.remove('scroll-hidden');
        fab && fab.classList.remove('scroll-hidden');
        dock && dock.classList.remove('scroll-hidden');
      }
      lastScrollY = cy;
    }, { passive: true });

    /* ============================================================
       🔐 AUTH 模块 — 使用 Supabase Auth（服务端 bcrypt）
       ============================================================ */
    var Auth = {
      switchTab: function(type) {
        playClick();
        if (type === 'login') {
          document.getElementById('tabLogin').classList.add('active');
          document.getElementById('tabRegister').classList.remove('active');
          document.getElementById('loginForm').style.display = 'block';
          document.getElementById('registerForm').style.display = 'none';
        } else {
          document.getElementById('tabRegister').classList.add('active');
          document.getElementById('tabLogin').classList.remove('active');
          document.getElementById('registerForm').style.display = 'block';
          document.getElementById('loginForm').style.display = 'none';
        }
      },

      handleSubmit: async function(e, type) {
        e.preventDefault();
        playClick();

        if (type === 'register') {
          var name = document.getElementById('regName').value.trim();
          var email = document.getElementById('regEmail').value.trim().toLowerCase();
          var pass1 = document.getElementById('regPassword').value;
          var pass2 = document.getElementById('regConfirmPassword').value;

          if (!name) return showAlert('失败','请输入你的名字/昵称！');
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showAlert('失败','请输入有效的邮箱地址！');
          if (pass1 !== pass2) return showAlert('失败','两次输入的密码不相同！');
          var err = validatePwd(pass1);
          if (err) return showAlert('失败', err);

          showLoading('正在创建账号…');
          var { data, error } = await _supabase.auth.signUp({
            email: email, password: pass1,
            options: { data: { username: name, avatar: DEFAULT_AVATAR, bio: '暂无简介...' } }
          });
          hideLoading();
          if (error) return showAlert('失败', '注册失败：' + error.message);

          // 创建对应的 profiles 记录
          if (data.user) {
            await _supabase.from('profiles').insert([{
              id: data.user.id, email: email, username: name,
              avatar: DEFAULT_AVATAR, bio: '暂无简介...', is_admin: false
            }]);
          }
          showAlert('成功','注册成功！请查收邮箱完成验证后登录。');
          Auth.switchTab('login');

        } else if (type === 'login') {
          var email = document.getElementById('loginEmail').value.trim().toLowerCase();
          var password = document.getElementById('loginPassword').value;

          if (!email || !password) return showAlert('失败','邮箱和密码不能为空！');
          var err = validatePwd(password);
          if (err) return showAlert('失败', err);

          showLoading('正在验证身份…');
          var { data, error } = await _supabase.auth.signInWithPassword({ email: email, password: password });
          hideLoading();
          if (error) return showAlert('失败', '登录失败：' + error.message);

          await Session.initFromAuth(data.user);
        }
      },

      logout: function() {
        showAlert('确认退出？','退出登录后需要重新输入邮箱和密码。', false, async function() {
          await _supabase.auth.signOut();
          localStorage.clear();
          location.reload();
        });
      },

      // 开发者授权（秘钥在服务端通过 RPC 验证）
      openDevAuth: function() {
        if (AppState.isAdmin) return showAlert('提示','你当前已经是开发者管理员！');
        showAlert('开发者授权','请输入开发者专属校验秘钥：', true, async function(key) {
          if (!key) return;
          var { data: isValid, error } = await _supabase.rpc('verify_dev_secret', { input_key: key });
          if (error) return showAlert('错误','校验请求失败');
          if (isValid) {
            await _supabase.from('profiles').update({ is_admin: true }).eq('id', AppState.userId);
            // 刷新本地状态（从服务端重新读取）
            await Session.refreshProfile();
            showAlert('成功','已获得最高开发者权限。', false, function() { location.reload(); });
          } else {
            showAlert('失败','秘钥错误！');
          }
        });
      },

      // 修改密码（通过 Supabase Auth API）
      openChangePwd: function() {
        document.getElementById('changePwdCurrent').value = '';
        document.getElementById('changePwdNew').value = '';
        document.getElementById('changePwdConfirm').value = '';
        document.getElementById('changePwdOverlay').classList.add('active');
      },
      closeChangePwd: function() {
        document.getElementById('changePwdOverlay').classList.remove('active');
      },
      submitChangePwd: async function() {
        var cur = document.getElementById('changePwdCurrent').value;
        var neu = document.getElementById('changePwdNew').value;
        var conf = document.getElementById('changePwdConfirm').value;
        if (!cur || !neu || !conf) return showAlert('失败','请完整填写所有密码字段！');
        if (neu !== conf) return showAlert('失败','两次输入的新密码不一致！');
        var err = validatePwd(neu);
        if (err) return showAlert('失败', err);
        if (neu === cur) return showAlert('失败','新密码不能与当前密码相同！');

        showLoading('正在更新密码…');
        // Supabase Auth 要求先重新验证旧密码
        var { error: signInErr } = await _supabase.auth.signInWithPassword({
          email: AppState.userEmail, password: cur
        });
        if (signInErr) { hideLoading(); return showAlert('失败','当前密码验证失败！'); }

        var { error: updErr } = await _supabase.auth.updateUser({ password: neu });
        hideLoading();
        if (updErr) return showAlert('失败', updErr.message || '更新密码失败');
        Auth.closeChangePwd();
        showAlert('成功','密码已更新，下次登录请使用新密码。');
      }
    };

    /* ---------- 密码强度校验 ---------- */
    function validatePwd(p) {
      if (p.length < 8) return '密码长度不能少于 8 位';
      if (!/[a-zA-Z]/.test(p) || !/\d/.test(p)) return '密码必须同时包含字母和数字';
      return null;
    }

    /* ============================================================
       👤 SESSION 模块 — 从服务端获取用户状态
       ============================================================ */
    var Session = {
      initFromAuth: async function(authUser) {
        if (!authUser) {
          var { data: { user } } = await _supabase.auth.getUser();
          authUser = user;
        }
        if (!authUser) {
          document.getElementById('authOverlay').style.display = 'flex';
          return;
        }

        // 从 profiles 表获取完整信息（RLS 保证只能读自己的）
        var { data: profile } = await _supabase
          .from('profiles').select('*').eq('id', authUser.id).single();

        if (profile) {
          AppState.userId = authUser.id;
          AppState.userEmail = profile.email || authUser.email || '';
          AppState.userName = profile.username || '用户';
          AppState.userAvatar = profile.avatar || DEFAULT_AVATAR;
          AppState.userBio = profile.bio || '暂无简介...';
          AppState.isAdmin = profile.is_admin === true || profile.is_admin === 'true';
        } else {
          // 首次登录但 profiles 未创建（兜底）
          AppState.userId = authUser.id;
          AppState.userEmail = authUser.email || '';
          AppState.userName = authUser.user_metadata?.username || '用户';
          AppState.userAvatar = DEFAULT_AVATAR;
          AppState.userBio = '暂无简介...';
          AppState.isAdmin = false;
        }
        AppState.loaded = true;

        document.getElementById('authOverlay').style.display = 'none';
        UI.updateProfileUI();
        Posts.fetchAll();
        Chat.init();
        Realtime.setup();
      },

      // 每次需要权限判断时，从服务端重新验证（防篡改）
      verifyAdmin: async function() {
        var { data: { user } } = await _supabase.auth.getUser();
        if (!user) return false;
        var { data: profile } = await _supabase
          .from('profiles').select('is_admin').eq('id', user.id).single();
        return profile?.is_admin === true || profile?.is_admin === 'true';
      },

      // 刷新本地 profile 状态
      refreshProfile: async function() {
        var { data: { user } } = await _supabase.auth.getUser();
        if (!user) return;
        var { data: profile } = await _supabase
          .from('profiles').select('*').eq('id', user.id).single();
        if (profile) {
          AppState.userName = profile.username || AppState.userName;
          AppState.userAvatar = profile.avatar || AppState.userAvatar;
          AppState.userBio = profile.bio || AppState.userBio;
          AppState.isAdmin = profile.is_admin === true || profile.is_admin === 'true';
        }
      }
    };

    /* ============================================================
       🎨 UI 模块
       ============================================================ */
    var UI = {
      switchTab: function(tab, idx) {
        document.querySelectorAll('.page-tab').forEach(function(el) { el.classList.remove('active-page'); });
        var t = document.getElementById(tab + 'Page');
        t && t.classList.add('active-page');
        document.getElementById('forumSearchBar').style.display = tab === 'forum' ? 'block' : 'none';
        document.getElementById('mainFabBtn').style.display = tab === 'forum' ? 'flex' : 'none';
        var ind = document.getElementById('dockIndicator');
        if (ind) ind.style.transform = 'translateX(' + (idx * 100) + '%)';
        document.querySelectorAll('.dock-item').forEach(function(b) { b.classList.remove('active'); });
        var btn = document.getElementById('dock' + tab.charAt(0).toUpperCase() + tab.slice(1));
        btn && btn.classList.add('active');
        if (tab === 'forum') Posts.fetchAll();
        if (tab === 'chat') Chat.renderList();
        if (tab === 'profile') Posts.fetchMine();
      },

      updateProfileUI: function() {
        document.getElementById('myNameDisplay').textContent = AppState.userName || '--';
        document.getElementById('myEmailDisplay').textContent = AppState.userEmail || '------';
        document.getElementById('myAvatarDisplay').src = AppState.userAvatar || DEFAULT_AVATAR;
        document.getElementById('myBioDisplay').textContent = AppState.userBio || '暂无简介...';
        document.getElementById('adminStatusTag').style.display = AppState.isAdmin ? 'inline-block' : 'none';
      },

      openPublish: function() {
        document.getElementById('pinOptionLabel').style.display = AppState.isAdmin ? 'flex' : 'none';
        document.getElementById('publishModal').style.display = 'flex';
      },
      closePublish: function() { document.getElementById('publishModal').style.display = 'none'; },

      openEditProfile: function() {
        document.getElementById('editNameInput').value = AppState.userName || '';
        document.getElementById('editBioInput').value = AppState.userBio || '';
        document.getElementById('editProfileModal').style.display = 'flex';
      },
      closeEditProfile: function() { document.getElementById('editProfileModal').style.display = 'none'; },

      openAvatarModal: function() { document.getElementById('avatarChoiceModal').style.display = 'flex'; },
      closeAvatarModal: function() { document.getElementById('avatarChoiceModal').style.display = 'none'; },

      handleAvatarFile: function(e) {
        var f = e.target.files[0];
        if (f) { var r = new FileReader(); r.onload = function(ev) { window._pendingAvatar = ev.target.result; }; r.readAsDataURL(f); }
      },
      applyAvatar: async function() {
        var qq = document.getElementById('quickQqInput').value.trim();
        var av = window._pendingAvatar || (qq.length >= 5 ? 'https://q1.qlogo.cn/g?b=qq&nk=' + qq + '&s=640' : null);
        if (!av) return showAlert('提示','请选取图片或输入有效 QQ 号！');
        showLoading('更新头像…');
        await _supabase.from('profiles').update({ avatar: av }).eq('id', AppState.userId);
        hideLoading();
        AppState.userAvatar = av;
        UI.updateProfileUI();
        UI.closeAvatarModal();
        Posts.fetchAll();
      },

      handleFileSelect: function(e) {
        var f = e.target.files[0];
        if (f) { var r = new FileReader(); r.onload = function(ev) { window._pendingImage = ev.target.result; }; r.readAsDataURL(f); }
      },

      onSearchInput: function() {
        var kw = document.getElementById('searchInput').value.trim().toLowerCase();
        var c = document.getElementById('postsContainer');
        if (!kw) { Posts.render(Posts._all, c); return; }
        var f = Posts._all.filter(function(p) { return (p.content && p.content.toLowerCase().includes(kw)) || (p.author && p.author.toLowerCase().includes(kw)); });
        Posts.render(f, c);
      },

      playClick: playClick,
      handleAvatarError: handleAvatarError,
      showAlert: showAlert,
      closeAlert: closeAlert,
      openActionSheet: openActionSheet,
      closeActionSheet: closeActionSheet,
      showToast: showToast
    };

    /* ============================================================
       📝 POSTS 模块
       ============================================================ */
    var Posts = {
      _all: [],
      _comments: [],
      _profiles: new Map(),

      fetchAll: async function() {
        showLoading('加载动态…');
        await Posts.fetchProfiles();
        var { data: posts } = await _supabase.from('posts').select('*');
        var { data: comments } = await _supabase.from('comments').select('*').order('id', {ascending:true});
        Posts._all = (posts || []).sort(function(a,b) {
          var pa = a.is_pinned === true || a.is_pinned === 'true' || a.is_pinned === 1 ? 1 : 0;
          var pb = b.is_pinned === true || b.is_pinned === 'true' || b.is_pinned === 1 ? 1 : 0;
          if (pa !== pb) return pb - pa;
          return b.id - a.id;
        });
        Posts._comments = comments || [];
        hideLoading();
        Posts.render(Posts._all, document.getElementById('postsContainer'));
      },

      fetchMine: async function() {
        await Posts.fetchProfiles();
        var mine = Posts._all.filter(function(p) { return p.user_id === AppState.userId; });
        Posts.render(mine, document.getElementById('myPostsContainer'));
      },

      fetchProfiles: async function() {
        var { data } = await _supabase.from('profiles').select('*');
        Posts._profiles.clear();
        if (data) data.forEach(function(p) { if (p.id) Posts._profiles.set(p.id, p); });
      },

      render: function(posts, container) {
        if (!posts || posts.length === 0) { container.innerHTML = '<div style="text-align:center; padding:30px; color:#8e8e93; font-size:12px;">暂无动态内容</div>'; return; }
        container.innerHTML = posts.map(function(p) {
          var profile = Posts._profiles.get(p.user_id) || {};
          var author = profile.username || p.author || '未知用户';
          var avatar = profile.avatar || DEFAULT_AVATAR;
          var isDev = profile.is_admin === true || profile.is_admin === 'true';
          var isMine = p.user_id === AppState.userId;
          var liked = !!likedPosts[p.id];
          var pinned = p.is_pinned === true || p.is_pinned === 'true' || p.is_pinned === 1;
          var postComments = Posts._comments.filter(function(c) { return c.post_id === p.id; });

          return '<div class="post-card ' + (pinned ? 'pinned' : '') + '">' +
            '<div class="post-header">' +
              '<div class="author-info" onclick="App.UI.openUserModal(\'' + (p.user_id||'') + '\',\'' + escapeHtml(author) + '\')">' +
                '<img class="user-avatar-img" src="' + avatar + '" onerror="App.UI.handleAvatarError(this)">' +
                '<div><div class="post-author-name">' +
                  (pinned ? '<span class="pin-badge"><svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-pin"></use></svg> 置顶</span>' : '') +
                  escapeHtml(author) + (isDev ? '<span class="dev-badge">开发者管理员</span>' : '') +
                '</div><div class="post-time">' + formatTime(p.created_at) + '</div></div>' +
              '</div>' +
              '<div class="mini-action-group">' +
                (AppState.isAdmin ? '<button class="mini-btn" onclick="App.UI.playClick();App.Posts.togglePin(' + p.id + ',' + pinned + ')"><svg class="icon-svg" style="' + (pinned?'color:#007aff;':'') + '" viewBox="0 0 24 24"><use href="#svg-pin"></use></svg></button>' : '') +
                ((isMine || AppState.isAdmin) ? '<button class="mini-btn" onclick="App.UI.playClick();App.Posts.deletePost(' + p.id + ')"><svg class="icon-svg" viewBox="0 0 24 24"><use href="#svg-trash"></use></svg></button>' : '') +
              '</div>' +
            '</div>' +
            '<div class="post-content">' + escapeHtml(p.content) + '</div>' +
            (p.image_url ? '<img class="post-image" src="' + escapeHtml(p.image_url) + '">' : '') +
            '<div class="post-footer"><div class="action-group">' +
              '<button class="action-btn ' + (liked ? 'liked' : '') + '" onclick="App.UI.playClick();App.Posts.like(' + p.id + ',' + (p.likes||0) + ')">' +
                '<svg class="icon-svg" viewBox="0 0 24 24"><use href="#' + (liked?'svg-heart-filled':'svg-heart-outline') + '"></use></svg><span>' + (p.likes||0) + '</span>' +
              '</button>' +
            '</div></div>' +
            '<div class="comments-section">' +
              postComments.map(function(c) {
                var cp = Posts._profiles.get(c.user_id) || {};
                var cn = cp.username || c.author || '未知用户';
                return '<div class="comment-item"><div class="comment-left"><span class="comment-author" onclick="App.UI.openUserModal(\'' + (c.user_id||'') + '\',\'' + escapeHtml(cn) + '\')">' + escapeHtml(cn) + '</span>:<span onclick="App.Posts.replyUser(' + p.id + ',\'' + escapeHtml(cn) + '\')">' + escapeHtml(c.content) + '</span><span class="comment-time">' + formatTime(c.created_at) + '</span></div>' +
                ((c.user_id === AppState.userId || AppState.isAdmin) ? '<button class="mini-btn" onclick="App.UI.playClick();App.Posts.deleteComment(' + c.id + ')">✕</button>' : '') +
                '</div>';
              }).join('') +
              '<div class="comment-input-group"><input type="text" id="commentInput_' + p.id + '" class="comment-input" placeholder="评论或回复..."><button class="comment-btn" onclick="App.UI.playClick();App.Posts.addComment(' + p.id + ')">发送</button></div>' +
            '</div></div>';
        }).join('');
      },

      togglePin: async function(id, cur) {
        if (!AppState.isAdmin) return;
        var { error } = await _supabase.from('posts').update({ is_pinned: !cur }).eq('id', id);
        if (error) showAlert('错误','更新置顶失败: ' + error.message);
        else Posts.fetchAll();
      },

      deletePost: function(id) {
        showAlert('确认删除？','删除后无法恢复。', false, async function() {
          await _supabase.from('posts').delete().eq('id', id);
          Posts.fetchAll();
        });
      },

      deleteComment: function(id) {
        showAlert('确认删除？','删除后无法恢复。', false, async function() {
          await _supabase.from('comments').delete().eq('id', id);
          Posts.fetchAll();
        });
      },

      like: async function(id, cur) {
        if (likedPosts[id]) return;
        likedPosts[id] = true;
        localStorage.setItem('campus_liked', JSON.stringify(likedPosts));
        // 使用 RPC 原子递增（防竞态）
        await _supabase.rpc('increment_post_likes', { post_id: id });
        Posts.fetchAll();
      },

      addComment: async function(pid) {
        var inp = document.getElementById('commentInput_' + pid);
        var txt = inp.value.trim();
        if (!txt) return;
        await _supabase.from('comments').insert([{ post_id: pid, author: AppState.userName, user_id: AppState.userId, content: txt }]);
        inp.value = '';
        Posts.fetchAll();
      },

      replyUser: function(pid, name) {
        playClick();
        var inp = document.getElementById('commentInput_' + pid);
        if (inp) { inp.value = '@' + name + ' '; inp.focus(); }
      },

      submit: async function() {
        var content = document.getElementById('contentInput').value.trim();
        if (!content && !window._pendingImage) return showAlert('提示','内容不能为空！');
        var shouldPin = AppState.isAdmin && document.getElementById('pinPostCheckbox')?.checked;
        showLoading('发布中…');
        await _supabase.from('posts').insert([{
          author: AppState.userName, user_id: AppState.userId,
          content: content, likes: 0, is_pinned: !!shouldPin, image_url: window._pendingImage || null
        }]);
        hideLoading();
        document.getElementById('contentInput').value = '';
        if (document.getElementById('pinPostCheckbox')) document.getElementById('pinPostCheckbox').checked = false;
        window._pendingImage = null;
        UI.closePublish();
        Posts.fetchAll();
      }
    };

    /* ============================================================
       💬 CHAT 模块
       ============================================================ */
    // 闭包变量（不挂在冻结对象上，可正常读写）
    var _chatTimer = null;

    var Chat = {
      activeTarget: null,
      replyIdx: null,
      unreadTotal: 0,

      init: async function() {
        _supabase.auth.onAuthStateChange(function(event, session) {
          if (event === 'SIGNED_OUT') location.reload();
        });
        Chat.renderList();
      },

      searchAndStart: async function() {
        var email = document.getElementById('chatSearchEmailInput').value.trim().toLowerCase();
        if (!email) return showAlert('提示','请输入需要查找的邮箱！');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showAlert('格式错误','请输入有效的邮箱地址！');

        showLoading('正在查找用户…');
        var { data: target } = await _supabase.from('profiles').select('*').eq('email', email).single();
        hideLoading();
        if (!target) return showAlert('查找失败','未找到该邮箱的用户！');
        if (target.id === AppState.userId) return showAlert('提示','不能给自己发送私信！');
        if (!localChats[target.id]) { localChats[target.id] = []; localStorage.setItem('campus_chats', JSON.stringify(localChats)); }
        document.getElementById('chatSearchEmailInput').value = '';
        Chat.openDialog(target.id);
      },

      renderList: async function() {
        var c = document.getElementById('chatFriendsContainer');
        c.innerHTML = Array(2).fill(0).map(function() {
          return '<div class="ios-skeleton-card"><div class="skeleton-avatar shimmer"></div><div class="skeleton-info"><div class="skeleton-line short shimmer"></div><div class="skeleton-line long shimmer"></div></div></div>';
        }).join('');

        await Posts.fetchProfiles();
        var uids = Object.keys(localChats);
        setTimeout(function() {
          if (uids.length === 0) { c.innerHTML = '<div style="text-align:center; padding:30px; color:#8e8e93; font-size:12px;">暂无私信记录，输入邮箱查找吧</div>'; Chat.updateBadge(0); return; }
          var total = 0;
          c.innerHTML = '';
          uids.forEach(function(uid) {
            var profile = Posts._profiles.get(uid) || {};
            var msgs = localChats[uid] || [];
            var unread = msgs.filter(function(m) { return m.sender === 'other' && !m.isRead; }).length;
            total += unread;
            var lastMsg = msgs.length > 0 ? msgs[msgs.length-1].text : '暂无聊天内容...';
            var lastTime = msgs.length > 0 ? msgs[msgs.length-1].time : '';
            var card = document.createElement('div');
            card.className = 'chat-item-card' + (unread > 0 ? ' has-unread' : '');
            card.innerHTML = '<div class="chat-avatar-wrapper"><img class="chat-item-avatar" src="' + (profile.avatar||DEFAULT_AVATAR) + '" onerror="App.UI.handleAvatarError(this)">' +
              (unread > 0 ? '<div class="unread-badge">' + (unread>99?'99+':unread) + '</div>' : '') +
              '</div><div class="chat-item-info"><div class="chat-item-name ' + (unread>0?'unread-name':'') + '">' + escapeHtml(profile.username||'用户') + '</div>' +
              '<div class="chat-item-lastmsg ' + (unread>0?'unread-msg':'') + '">' + escapeHtml(lastMsg) + '</div></div>' +
              '<div class="chat-item-time ' + (unread>0?'unread-time':'') + '">' + (lastTime?formatTime(lastTime):'') + '</div>';
            Chat.bindLongPress(card, uid);
            card.onclick = function() { Chat.handleClick(uid); };
            c.appendChild(card);
          });
          Chat.updateBadge(total);
        }, 300);
      },

      updateBadge: function(total) {
        Chat.unreadTotal = total;
        localStorage.setItem('campus_unread', String(total));
        var b = document.getElementById('chatNavBadge');
        if (!b) return;
        if (total > 0) { b.textContent = total > 99 ? '99+' : String(total); b.classList.remove('hidden'); }
        else { b.classList.add('hidden'); }
      },

      bindLongPress: function(el, uid) {
        var timer = null, triggered = false;
        var start = function() { triggered = false; clearTimeout(timer); timer = setTimeout(function() { triggered = true; playHaptic(); Chat.openMenu(uid); }, 400); };
        var cancel = function() { clearTimeout(timer); };
        el.addEventListener('touchstart', start, {passive:true}); el.addEventListener('touchend', cancel); el.addEventListener('touchmove', cancel);
        el.addEventListener('mousedown', start); el.addEventListener('mouseup', cancel); el.addEventListener('mouseleave', cancel);
      },

      handleClick: function(uid) { Chat.openDialog(uid); },

      openMenu: function(uid) {
        var profile = Posts._profiles.get(uid) || {};
        var name = profile.username || '用户';
        openActionSheet([
          { label: '🧹 清空与 ' + escapeHtml(name) + ' 的聊天记录', danger: true, action: 'App.Chat.clearHistory(\'' + uid + '\')' },
          { label: '🗑️ 删除联系人 ' + escapeHtml(name), danger: true, action: 'App.Chat.removeUser(\'' + uid + '\')' }
        ]);
      },

      clearHistory: function(uid) {
        showAlert('确认清空记录？','将抹除所有聊天记录。', false, function() {
          localChats[uid] = []; localStorage.setItem('campus_chats', JSON.stringify(localChats)); Chat.renderList();
        });
      },
      removeUser: function(uid) {
        showAlert('确认删除？','将从列表中移除该联系人。', false, function() {
          delete localChats[uid]; localStorage.setItem('campus_chats', JSON.stringify(localChats)); Chat.renderList();
        });
      },

      openDialog: function(uid) {
        Chat.activeTarget = uid;
        var profile = Posts._profiles.get(uid) || {};
        document.getElementById('targetChatName').textContent = profile.username || '用户';
        document.getElementById('targetChatAvatar').src = profile.avatar || DEFAULT_AVATAR;
        document.body.classList.add('chat-mode');
        document.getElementById('chatListView').style.display = 'none';
        document.getElementById('chatDialogView').style.display = 'block';
        Chat.replyIdx = null;
        document.getElementById('replyPreviewBar').classList.remove('active');
        Chat.markRead(uid);
        Chat.renderMessages();
      },

      backToList: function() {
        Chat.activeTarget = null;
        document.body.classList.remove('chat-mode');
        document.getElementById('chatDialogView').style.display = 'none';
        document.getElementById('chatListView').style.display = 'block';
        Chat.renderList();
      },

      renderMessages: function() {
        if (!Chat.activeTarget) return;
        var box = document.getElementById('chatMessagesBox');
        var msgs = localChats[Chat.activeTarget] || [];
        if (msgs.length === 0) { box.innerHTML = '<div style="text-align:center; color:#8e8e93; font-size:11px; margin-top:20px;">打个招呼吧 ~</div>'; return; }

        var meProfile = { name: AppState.userName, avatar: AppState.userAvatar };
        var otherProfile = Posts._profiles.get(Chat.activeTarget) || {};
        var otherName = otherProfile.username || '用户';
        var otherAvatar = otherProfile.avatar || DEFAULT_AVATAR;

        box.innerHTML = msgs.map(function(m, idx) {
          var isMe = m.sender === 'me';
          var timeStr = m.time ? new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
          var senderName = isMe ? meProfile.name : otherName;
          var senderAvatar = isMe ? meProfile.avatar : otherAvatar;
          var status = isMe ? (m.isRead ? '<span class="tg-read-status read">✓✓</span>' : '<span class="tg-read-status sent">✓</span>') : '';
          var reply = '';
          if (m.replyToIdx != null && msgs[m.replyToIdx]) {
            var rm = msgs[m.replyToIdx];
            var rn = rm.sender === 'me' ? meProfile.name : otherName;
            reply = '<div class="msg-reply-quote" onclick="App.Chat.scrollToMsg(' + m.replyToIdx + ')"><span class="msg-reply-author">← ' + escapeHtml(rn) + '</span><span class="msg-reply-text">' + escapeHtml(rm.text||'') + '</span></div>';
          }
          return '<div class="msg-row ' + (isMe?'me':'other') + '" id="msg-row-' + idx + '">' +
            '<img class="msg-avatar" src="' + senderAvatar + '" onerror="App.UI.handleAvatarError(this)">' +
            '<div class="msg-stack"><div class="msg-sender-name">' + escapeHtml(senderName) + '</div>' +
            '<div class="msg-bubble ' + (isMe?'me':'other') + '" oncontextmenu="event.preventDefault();playHaptic();Chat.openMsgMenu(' + idx + ')" ontouchstart="Chat.touchStart(' + idx + ')" ontouchend="Chat.touchEnd()">' +
              reply + '<span>' + escapeHtml(m.text) + '</span>' +
              '<div class="msg-meta-bar"><span>' + timeStr + '</span>' + status + '</div>' +
            '</div></div></div>';
        }).join('');
        box.scrollTop = box.scrollHeight;
      },

      touchStart: function(idx) {
        _chatTimer = setTimeout(function() { playHaptic(); Chat.openMsgMenu(idx); _chatTimer = null; }, 450);
      },
      touchEnd: function() { if (_chatTimer) { clearTimeout(_chatTimer); _chatTimer = null; } },

      openMsgMenu: function(idx) {
        var msgs = localChats[Chat.activeTarget] || [];
        var m = msgs[idx]; if (!m) return;
        var opts = [{ label: '↩️ 回复该消息', action: 'App.Chat.beginReply(' + idx + ')' }];
        if (m.sender === 'me') opts.push({ label: '↩️ 撤回并重新编辑', action: 'App.Chat.recall(' + idx + ')' });
        opts.push({ label: '🗑️ 删除该消息', danger: true, action: 'App.Chat.delMsg(' + idx + ')' });
        openActionSheet(opts);
      },

      beginReply: function(idx) {
        var msgs = localChats[Chat.activeTarget] || [];
        var m = msgs[idx]; if (!m) return;
        var isMe = m.sender === 'me';
        var otherProfile = Posts._profiles.get(Chat.activeTarget) || {};
        var name = isMe ? AppState.userName : (otherProfile.username || '用户');
        var avatar = isMe ? AppState.userAvatar : (otherProfile.avatar || DEFAULT_AVATAR);
        document.getElementById('replyPrevName').textContent = '回复 ' + name;
        document.getElementById('replyPrevText').textContent = m.text || '';
        document.getElementById('replyPrevAvatar').src = avatar;
        document.getElementById('replyPreviewBar').classList.add('active');
        Chat.replyIdx = idx;
        setTimeout(function() { document.getElementById('chatMsgInput').focus(); }, 100);
      },
      cancelReply: function() { Chat.replyIdx = null; document.getElementById('replyPreviewBar').classList.remove('active'); },

      scrollToMsg: function(idx) {
        var el = document.getElementById('msg-row-' + idx);
        if (!el) return;
        el.scrollIntoView({behavior:'smooth', block:'center'});
        var b = el.querySelector('.msg-bubble');
        if (b) { b.classList.remove('highlight'); void b.offsetWidth; b.classList.add('highlight'); }
      },

      recall: function(idx) {
        var msgs = localChats[Chat.activeTarget];
        if (!msgs || !msgs[idx]) return;
        var recalled = msgs[idx].text;
        msgs.splice(idx, 1);
        localStorage.setItem('campus_chats', JSON.stringify(localChats));
        document.getElementById('chatMsgInput').value = recalled;
        document.getElementById('chatMsgInput').focus();
        Chat.renderMessages();
      },
      delMsg: function(idx) {
        showAlert('确认删除？','将抹除该条消息。', false, function() {
          var msgs = localChats[Chat.activeTarget];
          if (msgs) { msgs.splice(idx, 1); localStorage.setItem('campus_chats', JSON.stringify(localChats)); Chat.renderMessages(); }
        });
      },

      sendMsg: function() {
        var inp = document.getElementById('chatMsgInput');
        var text = inp.value.trim();
        if (!text || !Chat.activeTarget) return;
        if (!localChats[Chat.activeTarget]) localChats[Chat.activeTarget] = [];
        localChats[Chat.activeTarget].push({
          sender: 'me', text: text, time: new Date().toISOString(), isRead: false,
          replyToIdx: Chat.replyIdx != null ? Chat.replyIdx : null
        });
        localStorage.setItem('campus_chats', JSON.stringify(localChats));
        inp.value = '';
        Chat.replyIdx = null;
        document.getElementById('replyPreviewBar').classList.remove('active');
        Chat.renderMessages();

        // 写入数据库（RLS 保证只有发送者能插入自己的消息）
        _supabase.from('messages').insert([{
          sender_id: AppState.userId, receiver_id: Chat.activeTarget, content: text, is_read: false
        }]);
        Chat.renderList();
      },

      onPlusClicked: function() {
        playClick();
        openActionSheet([
          { label: '🖼️ 发送图片', action: 'App.UI.showToast("图片功能开发中",2000)' },
          { label: '📎 发送文件', action: 'App.UI.showToast("文件功能开发中",2000)' }
        ]);
      },

      markRead: function(uid) {
        var msgs = localChats[uid];
        if (!msgs || msgs.length === 0) return;
        var changed = false;
        msgs.forEach(function(m) { if (m.sender === 'other' && !m.isRead) { m.isRead = true; changed = true; } });
        if (changed) {
          localStorage.setItem('campus_chats', JSON.stringify(localChats));
          _supabase.from('messages').update({ is_read: true }).match({ sender_id: uid, receiver_id: AppState.userId, is_read: false });
          Chat.renderMessages();
          Chat.renderList();
        }
      }
    };

    /* ============================================================
       📡 REALTIME 模块
       ============================================================ */
    var Realtime = {
      setup: function() {
        if (!AppState.userId) return;
        _supabase
          .channel('global-msg-' + AppState.userId)
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'receiver_id=eq.' + AppState.userId },
            function(payload) { Chat.handleIncoming(payload.new); })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: 'sender_id=eq.' + AppState.userId },
            function() { Chat.renderMessages(); Chat.renderList(); })
          .subscribe();
      }
    };

    // 挂载到 Chat 上
    Chat.handleIncoming = function(msg) {
      var from = msg.sender_id;
      if (!localChats[from]) localChats[from] = [];
      localChats[from].push({ sender: 'other', text: msg.content, time: msg.created_at || new Date().toISOString(), isRead: false });
      localStorage.setItem('campus_chats', JSON.stringify(localChats));
      if (Chat.activeTarget === from) { Chat.markRead(from); }
      else {
        var total = Chat.unreadTotal + 1;
        Chat.updateBadge(total);
        var profile = Posts._profiles.get(from) || {};
        showToast('📨 来自 ' + (profile.username || from) + ' 的新消息', 3000, function() {
          UI.switchTab('chat', 1); Chat.openDialog(from);
        });
      }
      Chat.renderList();
    };

    /* ============================================================
       👤 PROFILE 模块
       ============================================================ */
    var Profile = {
      save: async function() {
        var name = document.getElementById('editNameInput').value.trim();
        var bio = document.getElementById('editBioInput').value.trim();
        if (name) AppState.userName = name;
        if (bio) AppState.userBio = bio;
        showLoading('保存中…');
        await _supabase.from('profiles').update({ username: AppState.userName, bio: AppState.userBio }).eq('id', AppState.userId);
        hideLoading();
        UI.updateProfileUI();
        UI.closeEditProfile();
        Posts.fetchAll();
      }
    };

    /* ---------- 🔓 用户主页弹窗 ---------- */
    UI.openUserModal = function(uid, name) {
      playClick();
      var profile = Posts._profiles.get(uid) || {};
      document.getElementById('modalUserAvatar').src = profile.avatar || DEFAULT_AVATAR;
      document.getElementById('modalUserName').textContent = profile.username || name || '用户';
      document.getElementById('modalUserBio').textContent = profile.bio || '暂无简介...';
      var btn = document.getElementById('modalStartChatBtn');
      if (uid === AppState.userId) { btn.style.display = 'none'; }
      else { btn.style.display = 'inline-flex'; btn.onclick = function() { playClick(); UI.closeUserModal(); if (!localChats[uid]) localChats[uid] = []; localStorage.setItem('campus_chats', JSON.stringify(localChats)); UI.switchTab('chat', 1); Chat.openDialog(uid); }; }
      document.getElementById('userProfileModal').style.display = 'flex';
    };
    UI.closeUserModal = function() { document.getElementById('userProfileModal').style.display = 'none'; };

    /* ============================================================
       🔒 防调试 / 防注入 安全层
       ============================================================ */

    // 禁用 F12 / Ctrl+Shift+I / Ctrl+U / 右键
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) ||
          (e.ctrlKey && e.key === 'u')) {
        e.preventDefault();
        Security.emergencyCleanup();
        return false;
      }
    });
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });

    // 禁用 eval 和 Function 构造函数
    window.eval = function() { throw new Error('[Security] eval() is disabled'); };
    window.Function = function() { throw new Error('[Security] Function() constructor is disabled'); };

    // 检测 DevTools 打开
    setInterval(function() {
      var threshold = 160;
      var w = window.outerWidth - window.innerWidth > threshold;
      var h = window.outerHeight - window.innerHeight > threshold;
      if ((w || h) && !window._devtoolsDetected) {
        window._devtoolsDetected = true;
        Security.emergencyCleanup();
      } else if (!w && !h) { window._devtoolsDetected = false; }
    }, 2000);

    var Security = {
      emergencyCleanup: function() {
        console.clear();
        localStorage.removeItem('campus_chats');
        // 不清除认证信息（由 Supabase Auth 管理）
        showAlert('🚨 安全警告', '检测到调试行为，已清除本地聊天缓存。', false, function() {
          location.reload();
        });
      }
    };

    /* ============================================================
       🚀 全局 App 对象（冻结防止篡改）
       ============================================================ */
    window.App = Object.freeze({
      UI: Object.freeze(UI),
      Auth: Object.freeze(Auth),
      Posts: Object.freeze(Posts),
      Chat: Object.freeze(Chat),
      Profile: Object.freeze(Profile),
      Security: Object.freeze(Security)
    });

    // 冻结全局关键属性
    Object.defineProperty(window, 'App', { writable: false, configurable: false });
    Object.defineProperty(window, 'AppState', { writable: false, configurable: false });
    // 注意：不冻结 window.supabase（CDN 全局），只冻结我们的实例引用
    Object.defineProperty(window, '_supabase', { writable: false, configurable: false });

    /* ============================================================
       🚀 页面初始化
       ============================================================ */
    window.onload = function() {
      // 开屏动画
      setTimeout(function() {
        var splash = document.getElementById('splashScreen');
        if (splash) { splash.classList.add('fade-out'); setTimeout(function() { splash.style.display = 'none'; }, 600); }
      }, 1200);

      // 从 Supabase Auth 初始化会话
      Session.initFromAuth(null).catch(function(err) {
        console.error('[Init] Failed:', err);
        document.getElementById('authOverlay').style.display = 'flex';
      });
    };

  })();
  </script>
</body>
</html>
